<script>
(function () {
'use strict';
var call = window.lumenInternal, S = null, sec = '', query = '', dir = '', sort = 'date', shown = 300;
var NAMES = { home: 'Home', bookmarks: 'Bookmarks', history: 'History', downloads: 'Downloads', settings: 'Settings' };
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function q(s) { return encodeURIComponent(s); }
function $(id) { return document.getElementById(id); }
function param(k) { var m = new RegExp('[?&]' + k + '=([^&#]*)').exec(location.href); return m ? decodeURIComponent(m[1]) : ''; }
function load(cmd) {
    var text = call ? call(cmd) : null;
    if (!text) { $('main').innerHTML = '<div class=empty>This page only works inside Lumen.</div>'; return false; }
    S = JSON.parse(text);
    sec = S.sec;
    document.body.className = S.panel ? 'panel' : '';
    if (S.dl && S.dl.dir) dir = S.dl.dir;
    return true;
}
function state() { return load('state?s=' + sec + (sec === 'downloads' && dir ? '&dir=' + q(dir) : '')); }
function set(args) { if (load('set?s=' + sec + (dir ? '&dir=' + q(dir) : '') + '&' + args)) render(); }
function matches(/* strings */) {
    if (!query) return true;
    for (var i = 0; i < arguments.length; i++) if (String(arguments[i] || '').toLowerCase().indexOf(query) >= 0) return true;
    return false;
}
var ADD = '<button id=bmadd class=add title="Add the current page" aria-label="Add the current page" data-cmd="bm_add=1"><svg width=20 height=20 viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>';
var DOTS = '<svg width=20 height=20 viewBox="0 0 24 24"><circle cx=12 cy=5 r=2 fill="currentColor"/><circle cx=12 cy=12 r=2 fill="currentColor"/><circle cx=12 cy=19 r=2 fill="currentColor"/></svg>';
var menuFor = -1, editing = -1;   /* the bookmark whose \u22ee menu is open, the one being edited */
var HEADS = { home: ['Home', 'Search tabs or type a URL'], bookmarks: ['Bookmarks', 'Search bookmarks'], history: ['History', 'Search history'],
    downloads: ['Downloads', 'Search this folder'], settings: ['Settings', 'Search settings'] };
var ICONS = { home: '<path d="M3.5 10.5 12 4l8.5 6.5V20h-5.5v-6h-6v6H3.5z"/>', bookmarks: '<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>',
    history: '<circle cx=12 cy=12 r=8.5 /><path d="M12 7.5V12l3 2"/>', downloads: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
    settings: '<circle cx=12 cy=12 r=3 /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>' };
/* stroke attributes on each shape: Lumen's SVG doesn't inherit them from the <svg> */
function icon(shapes) { return shapes.replace(/<(path|circle)/g, '<$1 fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"'); }
/* the top bar: a section icon each, then the search field of the section shown (it only searches there) */
function nav() {
    var o = '';
    S.sections.forEach(function (s) { o += '<a class="s' + (s === sec ? ' on' : '') + '" href="lumen://newtab?s=' + s + '" data-sec=' + s + ' title="' + NAMES[s] + '" aria-label="' + NAMES[s] + '"><svg width=24 height=24 viewBox="0 0 24 24">' + icon(ICONS[s]) + '</svg></a>'; });
    o += '<span class=sp></span>' + (sec === 'bookmarks' ? ADD : '') + '<button class=s id=sbtn title="' + h(HEADS[sec][1]) + '" aria-label="Search"><svg width=24 height=24 viewBox="0 0 24 24">' + icon('<circle cx=10.5 cy=10.5 r=6 /><path d="M15 15l5 5"/>') + '</svg></button><input id=search class=search type=search placeholder="' + h(HEADS[sec][1]) + '" value="' + h(query) + '">';
    if (S.panel) o += '<a class=close href="lumen://panel?close" title=Close>×</a>';   /* the menu's panel over a page */
    $('nav').innerHTML = o;
}
function size(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return Math.round(n / 1024) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
}
function when(t) {
    var d = new Date(t * 1000), now = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    var clock = p(d.getHours()) + ':' + p(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return 'Today ' + clock;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + clock;
}
function ext(name) { var i = name.lastIndexOf('.'); return i > 0 && name.length - i <= 6 ? name.slice(i + 1).toUpperCase() : ''; }

/* ---------- Home: each workspace in its own lightly tinted box, its name above its tabs ---------- */
var wsMenu = -1, wsEdit = -1;   /* the workspace whose long-press menu is open, the one being renamed */
var WSC = ['#f5f8fe', '#f4faf5', '#fefaf1', '#f9f6fd', '#f2f9f9', '#fdf5f8', '#f8faef', '#f6f7f9'];
function wsName(w, wi) { return '<a class="wsn' + (w.cur ? ' cur' : '') + '" data-ws=' + wi + ' href="lumen://workspace?select=' + wi + '" title="' + h(w.name) + '">' + h(w.name) + '</a>'; }
function home() {
    var o = '', first = -1;
    S.ws.forEach(function (w, wi) {
        var tabs = w.tabs.filter(function (t) { return matches(t.title, t.url); });
        if (query && !tabs.length && !matches(w.name)) return;
        if (first < 0) first = wi;
        o += '<div class="ws' + (w.cur ? ' cur' : '') + (wsMenu === wi ? ' open' : '') + '" data-ws=' + wi + ' style="background:' + WSC[wi % WSC.length] + '">';
        if (wsEdit === wi) {
            o += '<div class=wsedit><input id=ws_name placeholder="Workspace name" maxlength=60 value="' + h(w.name) + '"><button class="btn on" data-wssave=' + wi + '>Save</button><button class=btn data-wsedit=-1>Cancel</button></div></div>';
            return;
        }
        o += wsName(w, wi);
        o += '<div class=tabs>';
        tabs.forEach(function (t) {
            o += '<a class="tab' + (t.cur ? ' cur' : '') + '" href="lumen://workspace?open=' + t.i + '"><div class=t>' + h(t.title) + '</div><div class=u>' + h(t.url) + '</div></a>';
        });
        if (!tabs.length) o += '<div class="empty sub">No open tabs.</div>';
        o += '</div>';
        if (wsMenu === wi) {
            o += '<div class=pop role=menu><span data-wsedit=' + wi + '>Rename</span>' + (S.canAddWs ? '<a href="lumen://workspace?dup=' + wi + '">Duplicate</a>' : '')
                + (S.ws.length > 1 ? '<a class=del href="lumen://workspace?close=' + wi + '">Close workspace</a>' : '') + '</div>';
        }
        o += '</div>';
    });
    if (first < 0) o += '<div class="card"><div class=empty>No tabs match. Press Enter to open it.</div></div>';
    o += '<p class=sub>Tap a tab to open it, or a workspace name to switch to it. Long-press a workspace to rename, duplicate or close it.</p>';
    return o;
}
/* Home opens with the current workspace in the middle of the screen */
function centerWs() {
    var c = document.querySelector('.ws.cur');
    if (!c) return;
    var r = c.getBoundingClientRect();
    window.scrollTo(0, Math.max(0, window.scrollY + r.top + r.height / 2 - window.innerHeight / 2));
}
var NEWWS = '<a id=wsnew title="New workspace" aria-label="New workspace" href="lumen://workspace?new"><svg width=26 height=26 viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></a>';

/* ---------- Bookmarks and History ---------- */
function links(bm) {
    var v = bm ? S.bm : S.hist, o = '', n = 0, more = false;

}, true);
document.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    if (sec === 'pick') { pkClick(e); return; }
    var t = e.target;
    if (V && t === V.root) { viewClose(); return; }   /* the dimmed space around the viewer */
    for (; t && t !== document.body; t = t.parentNode) {
        if (!t.getAttribute) continue;
        var v;
        if ((v = t.getAttribute('data-sec'))) {
            e.preventDefault();
            if (v === sec) { if (state()) render(); return; }   /* again: fresh state, e.g. after granting file access */
            sec = v; query = ''; shown = 300; menuFor = editing = -1; $('search').value = '';
            history.replaceState(null, '', 'lumen://newtab?s=' + v);
            window.scrollTo(0, 0);
            if (state()) render();
            return;
        }
        if (V && (v = t.getAttribute('data-vwpct'))) { var dd = $('vwdd'); if (dd) dd.parentNode.removeChild(dd); viewSetPct(+v); return; }
        if (V && (v = t.getAttribute('data-vw'))) { viewCmd(v); V.held = false; return; }
        if (t.id === 'snipsave') {
            e.preventDefault();
            var enc = $('snips').value.split('\n').filter(function (l) { return l.trim(); }).map(function (l) {
                return l.replace(/\\n/g, '\n').replace(/[%|\r\n]/g, function (c) { return '%' + ('0' + c.charCodeAt(0).toString(16).toUpperCase()).slice(-2); });
            }).join('|');
            set('snippets=' + q(enc)); return;
        }
        if (t.id === 'sbtn') {   /* the search icon: a floating field that searches this section as you type */
            e.preventDefault();
            var nv = $('nav'), open = !/\bsopen\b/.test(nv.className);
            nv.className = open ? 'sopen' : query ? 'found' : '';
            if (open) $('search').focus();
            return;
        }
        if ((v = t.getAttribute('data-cmd'))) { e.preventDefault(); menuFor = wsMenu = -1; set(v); return; }
        if ((v = t.getAttribute('data-grp'))) {
            openGroups[v] = !openGroups[v]; var op = openParam();
            history.replaceState(null, '', 'lumen://newtab?s=settings' + (op ? '&open=' + op : '')); render(); return;
        }
        if ((v = t.getAttribute('data-wsedit'))) { wsEdit = +v; wsMenu = -1; render(); if (wsEdit >= 0) { $('ws_name').focus(); $('ws_name').select(); } return; }
        if ((v = t.getAttribute('data-wssave'))) { var nm = $('ws_name').value.trim(); wsEdit = -1; if (nm) set('ws_rename=' + v + '&ws_name=' + q(nm)); else render(); return; }
        if ((v = t.getAttribute('data-bmmenu'))) { v = +v; menuFor = menuFor === v ? -1 : v; render(); return; }
        if ((v = t.getAttribute('data-bmedit'))) { editing = +v; menuFor = -1; render(); if (editing >= 0) $('bm_t').focus(); return; }
        if ((v = t.getAttribute('data-bmsave'))) { editing = -1; set('bm_save=' + v + '&bm_t=' + q($('bm_t').value.trim()) + '&bm_u=' + q($('bm_u').value.trim())); return; }
        if (t.className === 'pop') return;
        if ((v = t.getAttribute('data-dir'))) { dir = v; query = ''; shown = 300; $('search').value = ''; if (state()) { render(); window.scrollTo(0, 0); } return; }
        if ((v = t.getAttribute('data-open'))) { if (viewKind(v)) viewOpen(v); else load('set?s=downloads&dir=' + q(dir) + '&files_open=' + q(v)); return; }
        if ((v = t.getAttribute('data-sort'))) { sort = v; render(); return; }
        if (t.getAttribute('data-more')) { shown += 300; render(); return; }
        if (t.getAttribute('data-save')) { set('cpu_pct=' + (parseInt($('cpu_pct').value, 10) || 0) + '&cpu_secs=' + (parseInt($('cpu_secs').value, 10) || 0) + '&cpu_lim=' + (parseInt($('cpu_lim').value, 10) || 0)); return; }
        if (t.getAttribute('data-hex')) { var c = $('fbc').value.replace(/^#/, ''); if (/^[0-9a-fA-F]{6}$/.test(c)) set('touchfb_hex=' + c); return; }
    }
    if (menuFor >= 0 || wsMenu >= 0) { menuFor = wsMenu = -1; render(); }
});

sec = param('s'); dir = param('dir');
if (load('state?s=' + q(sec) + (dir ? '&dir=' + q(dir) : ''))) {
    render();
    var shared = param('view');   /* a file another app opened with Lumen */
    if (shared && sec === 'downloads' && viewKind(shared)) viewOpen(shared);
}
})();
</script>
</body></html>
