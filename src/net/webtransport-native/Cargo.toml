[package]
name = "lumen-webtransport-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "lumen_webtransport_native"
crate-type = ["staticlib", "rlib"]

[dependencies]
wtransport = { version = "=0.7.2", features = ["quinn"] }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "time", "io-util", "sync"] }
serde_json = "=1.0.154"
url = "=2.5.8"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
codegen-units = 2
lto = "thin"
