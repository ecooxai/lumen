<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen device APIs</title>
<style>body{font:16px system-ui;margin:16px}button{font-size:16px;margin:4px;padding:8px 12px}pre{background:#f3f3f3;padding:8px;white-space:pre-wrap}video{width:240px;height:180px;background:#000}</style></head>
<body>
<h2>Lumen device API check</h2>
<button id="geo">Location</button><button id="cam">Camera</button><button id="mic">Mic level</button><button id="wasm">WASM</button>
<a id="dl" href="#" download="lumen-test.txt"><button>Download blob</button></a>
<p><input type="file" id="file" multiple></p>
<video id="v" autoplay playsinline muted></video>
<pre id="log"></pre>
<script>
const log = (k, v) => { document.getElementById('log').textContent += k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v)) + '\n'; document.title = 'OK ' + k; };
geo.onclick = () => navigator.geolocation.getCurrentPosition(p => log('geo', { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }), e => log('geo-error', e.code + ' ' + e.message), { timeout: 20000 });
cam.onclick = () => navigator.mediaDevices.getUserMedia({ video: true }).then(s => { v.srcObject = s; v.onplaying = () => log('camera', v.videoWidth + 'x' + v.videoHeight); }, e => log('camera-error', e.name + ' ' + e.message));
mic.onclick = () => navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
  const ac = new AudioContext(), an = ac.createAnalyser(), src = ac.createMediaStreamSource(s), g = ac.createGain(); g.gain.value = 0;
  src.connect(an); an.connect(g); g.connect(ac.destination);
  const b = new Float32Array(an.fftSize); let n = 0;
  const t = setInterval(() => { an.getFloatTimeDomainData(b); let m = 0; for (const x of b) m = Math.max(m, Math.abs(x)); if (++n >= 10) { clearInterval(t); log('mic-peak', m.toFixed(4)); s.getTracks().forEach(x => x.stop()); } }, 200);
}, e => log('mic-error', e.name + ' ' + e.message));
wasm.onclick = () => {
  const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
  WebAssembly.instantiate(bytes).then(r => log('wasm add(2,40)', String(r.instance.exports.add(2, 40))), e => log('wasm-error', String(e)));
};
dl.onclick = () => { dl.href = URL.createObjectURL(new Blob(['hello from lumen ' + new Date().toISOString()], { type: 'text/plain' })); };
file.onchange = () => { for (const f of file.files) f.text().then(t => log('upload', f.name + ' ' + f.size + 'B ' + JSON.stringify(t.slice(0, 40)))); };
navigator.permissions.query({ name: 'geolocation' }).then(s => log('perm-geo', s.state));
</script></body></html>
