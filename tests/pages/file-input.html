<!doctype html>
<meta charset=utf-8>
<title>File input</title>
<!-- the file chooser: tap a field, choose, and the page lists the files it got (console.warn "FILEIN ...") -->
<style>
body{margin:0;font:20px system-ui,sans-serif}
label{display:block;margin:16px;padding:16px;border:2px solid #1a73e8;border-radius:12px}
input{display:block;width:100%;height:80px;font-size:20px}
pre{margin:16px;white-space:pre-wrap}
</style>
<label>One file <input id=one type=file></label>
<label>Images, several <input id=many type=file multiple accept="image/*"></label>
<pre id=out>No files yet</pre>
<script>
function show(e) {
    var f = e.target.files, t = e.target.id + ': ' + f.length + ' file(s)';
    for (var i = 0; i < f.length; i++) t += '\n  ' + f[i].name + ' ' + f[i].size + ' B ' + (f[i].type || '?');
    document.getElementById('out').textContent = t;
    console.warn('FILEIN ' + t.replace(/\n/g, ' |'));
}
document.getElementById('one').addEventListener('change', show);
document.getElementById('many').addEventListener('change', show);
document.getElementById('one').addEventListener('cancel', function () { console.warn('FILEIN one: cancel'); });
document.getElementById('many').addEventListener('cancel', function () { console.warn('FILEIN many: cancel'); });
</script>
