<!doctype html><meta charset="utf-8"><title>Grid grammar cache semantic controls</title>
<style>body{font:16px sans-serif}</style><pre id="results">Running</pre><script>
(async()=>{
 const results=[], eq=(a,b)=>{if(a!==b)throw Error(JSON.stringify(a)+' != '+JSON.stringify(b));};
 const test=(name,fn)=>{try{fn();results.push({name,status:'PASS'});}catch(e){results.push({name,status:'FAIL',message:String(e.message||e)});}};
 const node=()=>{const e=document.createElement('div');e.style.cssText='display:grid;width:200px;height:80px';document.body.append(e);return e;};
 const withNode=fn=>{const e=node();try{fn(e);}finally{e.remove();}};
 test('same text keeps property-specific grammar',()=>withNode(e=>{for(let i=0;i<3;i++){e.style.gridTemplateColumns='none';eq(e.style.gridTemplateColumns,'none');e.style.gridAutoColumns='20px';e.style.gridAutoColumns='none';eq(e.style.gridAutoColumns,'20px');}}));
 test('placement auto does not validate auto-flow auto',()=>withNode(e=>{for(let i=0;i<3;i++){e.style.gridRowStart='auto';eq(e.style.gridRowStart,'auto');e.style.gridAutoFlow='column';e.style.gridAutoFlow='auto';eq(e.style.gridAutoFlow,'column');}}));
 test('invalid cached input never replaces a declaration',()=>withNode(e=>{e.style.gridTemplateColumns='20px';for(let i=0;i<5;i++){e.style.gridTemplateColumns='repeat(0, 1fr)';eq(e.style.gridTemplateColumns,'20px');}}));
 test('priority remains outside parsed grammar',()=>withNode(e=>{e.style.setProperty('grid-template-columns','30px','important');eq(e.style.getPropertyPriority('grid-template-columns'),'important');e.style.setProperty('grid-template-columns','30px','');eq(e.style.getPropertyPriority('grid-template-columns'),'');eq(e.style.gridTemplateColumns,'30px');}));
 test('invalid priority cannot commit a cached parse',()=>withNode(e=>{e.style.gridTemplateColumns='20px';e.style.setProperty('grid-template-columns','30px','invalid');eq(e.style.gridTemplateColumns,'20px');}));
 test('pending custom-property substitution remains live',()=>withNode(e=>{e.style.setProperty('--tracks','40px 60px');e.style.gridTemplateColumns='var(--tracks)';eq(getComputedStyle(e).gridTemplateColumns,'40px 60px');e.style.setProperty('--tracks','50px 70px');e.style.gridTemplateColumns='var(--tracks)';eq(getComputedStyle(e).gridTemplateColumns,'50px 70px');}));
 test('same relative grammar follows each element font',()=>{const a=node(),b=node();try{a.style.fontSize='10px';b.style.fontSize='20px';a.style.gridTemplateColumns=b.style.gridTemplateColumns='1em 2em';eq(getComputedStyle(a).gridTemplateColumns,'10px 20px');eq(getComputedStyle(b).gridTemplateColumns,'20px 40px');b.style.fontSize='30px';b.style.gridTemplateColumns='1em 2em';eq(getComputedStyle(b).gridTemplateColumns,'30px 60px');}finally{a.remove();b.remove();}});
 test('same percentage grammar follows current geometry',()=>withNode(e=>{e.style.gridTemplateColumns='25% 75%';eq(getComputedStyle(e).gridTemplateColumns,'50px 150px');e.style.width='400px';e.style.gridTemplateColumns='25% 75%';eq(getComputedStyle(e).gridTemplateColumns,'100px 300px');}));
 test('escaped line-name grammar survives repeated assignments',()=>withNode(e=>{for(let i=0;i<3;i++){e.style.gridTemplateColumns='[a\\+b] 10px [x\\]y]';eq(getComputedStyle(e).gridTemplateColumns,'[a\\+b] 10px [x\\]y]');}}));
 test('shorthand components are independent between declarations',()=>{const a=node(),b=node();try{a.style.gridArea=b.style.gridArea='2 / 3 / 4 / 5';a.style.gridRowStart='6';eq(b.style.gridArea,'2 / 3 / 4 / 5');eq(a.style.gridColumnStart,'3');eq(b.style.gridRowStart,'2');}finally{a.remove();b.remove();}});
 test('cascading important merge is not cached',()=>withNode(e=>{e.style.cssText='grid-template-columns:30px!important;grid-template-columns:20px';eq(e.style.gridTemplateColumns,'30px');e.style.cssText='grid-template-columns:30px;grid-template-columns:20px';eq(e.style.gridTemplateColumns,'20px');}));
 test('value coercion still executes for every call',()=>withNode(e=>{let calls=0;const value={toString(){calls++;return calls===1?'10px':'20px';}};e.style.setProperty('grid-template-columns',value);eq(e.style.gridTemplateColumns,'10px');e.style.setProperty('grid-template-columns',value);eq(e.style.gridTemplateColumns,'20px');eq(calls,2);}));
 test('bounded unique-value churn preserves later repeated declarations',()=>withNode(e=>{for(let i=1;i<=300;i++){e.style.gridTemplateColumns=i+'px';eq(e.style.gridTemplateColumns,i+'px');}e.style.gridTemplateColumns='17px';eq(getComputedStyle(e).gridTemplateColumns,'17px');}));
 test('new grammar cache is independent of mutable helper prototypes',()=>withNode(e=>{const keys=Map.prototype.keys,reduce=Array.prototype.reduce,freeze=Object.freeze;try{Map.prototype.keys=()=>{throw Error('author Map.keys')};Array.prototype.reduce=()=>{throw Error('author Array.reduce')};Object.freeze=()=>{throw Error('author Object.freeze')};for(let i=1;i<=140;i++){e.style.gridTemplateColumns=(1000+i)+'px';eq(e.style.gridTemplateColumns,(1000+i)+'px');}}finally{Map.prototype.keys=keys;Array.prototype.reduce=reduce;Object.freeze=freeze;}}));
 test('long declarations bypass cache without changing semantics',()=>withNode(e=>{const value=Array(180).fill('1px').join(' ');for(let i=0;i<2;i++){e.style.gridTemplateColumns=value;eq(e.style.gridTemplateColumns,value);eq(getComputedStyle(e).gridTemplateColumns,value);}}));
 test('external style attribute writes still invalidate declarations',()=>withNode(e=>{e.style.gridTemplateColumns='30px';eq(e.style.gridTemplateColumns,'30px');e.setAttribute('style','display:grid;grid-template-columns:50px');eq(e.style.gridTemplateColumns,'50px');e.style.gridTemplateColumns='30px';eq(getComputedStyle(e).gridTemplateColumns,'30px');}));
 test('display transitions preserve computed and used distinctions',()=>withNode(e=>{e.style.gridTemplateColumns='repeat(2,1fr)';eq(getComputedStyle(e).gridTemplateColumns,'100px 100px');e.style.display='none';e.style.gridTemplateColumns='repeat(2,1fr)';eq(getComputedStyle(e).gridTemplateColumns,'repeat(2, 1fr)');e.style.display='grid';eq(getComputedStyle(e).gridTemplateColumns,'100px 100px');}));
 const f=document.createElement('iframe');try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('frame timeout')),5000);f.onload=()=>{clearTimeout(timer);resolve();};f.srcdoc='<!doctype html><div id="g" style="display:grid;font-size:25px;width:200px"></div>';document.body.append(f);});test('foreign document computes relative sizes in its own context',()=>{const e=f.contentDocument.getElementById('g');e.style.gridTemplateColumns='1em 2em';eq(f.contentWindow.getComputedStyle(e).gridTemplateColumns,'25px 50px');eq(getComputedStyle(e).gridTemplateColumns,'25px 50px');});}catch(e){results.push({name:'foreign document setup',status:'FAIL',message:String(e)});}finally{f.remove();}
 const pass=results.filter(r=>r.status==='PASS').length,marker='RESULTS browser-grid-grammar-cache:'+(pass===results.length?'PASS':'FAIL')+' '+pass+'/'+results.length;console.log(marker);for(const row of results)console.log('GRID_GRAMMAR_CACHE_RESULT '+JSON.stringify(row));document.getElementById('results').textContent=marker;
})();
</script>
