<!doctype html><meta charset="utf-8"><title>Clamp grammar and dimension controls</title><div id="host" style="width:200px"></div><pre id="results"></pre><script>
const cases=[["extra-paren", "clamp(1px,5px,10px))", 7], ["extra-square", "clamp(1px,5px,10px)]", 7], ["extra-curly", "clamp(1px,5px,10px)}", 7], ["two-arguments", "clamp(1px,5px)", 7], ["four-arguments", "clamp(1px,5px,10px,20px)", 7], ["trailing-comma", "clamp(1px,5px,10px,)", 7], ["trailing-token", "clamp(1px,5px,10px) junk", 7], ["mixed-angle", "clamp(1px,5deg,10px)", 7], ["mixed-time", "clamp(1px,5s,10px)", 7], ["all-angle-padding", "clamp(1deg,5deg,10deg)", 7], ["all-time-padding", "clamp(1s,5s,10s)", 7], ["mixed-number", "clamp(1px,5,10px)", 7], ["mixed-angle-nested", "calc(clamp(1px,5deg,10px) * 2)", 7], ["valid-clamp", "clamp(1px,5px,10px)", 5], ["valid-scaled-clamp", "calc(clamp(1px,5px,10px) * 2)", 10], ["sin-degrees", "calc(sin(30deg) * 10px)", 5], ["cos-degrees", "calc(cos(60deg) * 10px)", 5], ["tan-degrees", "calc(tan(45deg) * 10px)", 10], ["sin-radians", "calc(sin(0.5235987755982988rad) * 10px)", 5], ["sin-turns", "calc(sin(.08333333333333333turn) * 10px)", 5], ["sin-unitless-radians", "calc(sin(.5235987755982988) * 10px)", 5], ["number-clamp-times-length", "calc(clamp(0,.5,1) * 10px)", 5], ["angle-clamp-inside-trig", "calc(sin(clamp(0deg,30deg,90deg)) * 10px)", 5], ["mixed-angle-units-inside-trig", "calc(sin(calc(45deg + .125turn)) * 10px)", 10], ["percentage-clamp-plus-length", "calc(clamp(0%,5%,10%) + 1px)", 11]],transforms=[["rotate-deg", "rotate(30deg)", [0.8660254037844386, 0.5, -0.5, 0.8660254037844386, 0, 0]], ["rotate-turn", "rotate(.25turn)", [0, 1, -1, 0, 0, 0]], ["rotate-rad", "rotate(1.5707963267948966rad)", [0, 1, -1, 0, 0, 0]], ["translate-length", "translate(10px,20px)", [1, 0, 0, 1, 10, 20]], ["translate-calc", "translateX(calc(5px + 5px))", [1, 0, 0, 1, 10, 0]], ["translate-percent", "translate(10%,20%)", [1, 0, 0, 1, 4, 4]]],checks=[];let passed=0;
function check(name,field,actual,expected){const ok=typeof actual==='number'&&Number.isFinite(actual)&&Math.abs(actual-expected)<=.05;checks.push({name,field,actual,expected,passed:ok});if(ok)passed++;}
const host=document.getElementById('host');
for(const [name,expression,padding]of cases){
 const el=document.createElement('div');el.style.cssText='box-sizing:content-box;width:30px;height:20px;padding-left:7px;margin-left:4px;padding-left:'+expression+';margin-left:11px;';host.appendChild(el);
 const s=getComputedStyle(el);check(name,'paddingLeft',parseFloat(s.paddingLeft),padding);check(name,'followingSiblingDeclaration',parseFloat(s.marginLeft),11);check(name,'borderBoxWidth',el.getBoundingClientRect().width,30+padding);el.remove();
}
for(const [name,expression,matrix]of transforms){
 const el=document.createElement('div');el.style.cssText='width:40px;height:20px;padding:0;border:0;transform-origin:0 0;transform:'+expression+';';host.appendChild(el);
 const text=getComputedStyle(el).transform,match=text.match(/^matrix\(([^)]+)\)$/),actual=match?match[1].split(',').map(Number):[];
 for(let i=0;i<6;i++)check(name,'matrix'+i,actual[i],matrix[i]);el.remove();
}
const result={passed,failed:checks.length-passed,total:checks.length,checks},serialized=JSON.stringify(result);document.getElementById('results').textContent='LUMEN_CLAMP_DIMENSION_RESULT:'+serialized;
for(let i=0;i<Math.ceil(serialized.length/256);i++)console.log('LUMEN_AUTHORED_CHUNK '+i+' '+JSON.stringify(serialized.slice(i*256,(i+1)*256)));
console.log('LUMEN_AUTHORED_DONE '+Math.ceil(serialized.length/256));console.log('RESULTS CLAMP_DIMENSION:'+(result.failed?'FAIL':'PASS')+' '+passed+'/'+checks.length);
</script>
