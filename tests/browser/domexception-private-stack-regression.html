<!doctype html><meta charset="utf-8"><title>DOMException private stack side-effect controls</title><script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script><body><script>
const kinds=['name getter','message getter','stack getter','stack data','formatter function','formatter getter'];
function probe(kind){let calls=0,e=new DOMException('private message','InvalidStateError'),result={kind};const previous=Object.getOwnPropertyDescriptor(Error,'prepareStackTrace');try{if(kind==='formatter function')Object.defineProperty(Error,'prepareStackTrace',{configurable:true,value:()=>{calls++;return'AUTHOR FORMAT';}});else if(kind==='formatter getter')Object.defineProperty(Error,'prepareStackTrace',{configurable:true,get(){calls++;return()=>{calls++;return'AUTHOR FORMAT';};}});else if(kind==='stack data')Object.defineProperty(e,'stack',{value:'AUTHOR STACK'});else Object.defineProperty(e,kind.split(' ')[0],{get(){calls++;throw new Error('author getter read');}});const c=structuredClone(e);result.message=c.message;result.name=c.name;result.code=c.code;result.stackType=typeof c.stack;result.authorStack=c.stack==='AUTHOR STACK'||c.stack==='AUTHOR FORMAT';result.error=null;}catch(err){result.error=String(err);}finally{if(previous)Object.defineProperty(Error,'prepareStackTrace',previous);else delete Error.prepareStackTrace;}result.calls=calls;return result;}
function verify(r){assert_equals(r.error,null);assert_equals(r.calls,0);assert_equals(r.message,'private message');assert_equals(r.name,'InvalidStateError');assert_equals(r.code,11);assert_false(r.authorStack);assert_true(r.stackType==='string'||r.stackType==='undefined');}
for(const kind of kinds)test(()=>verify(probe(kind)),'Page clone does not invoke '+kind);
const workerSource=probe.toString()+';postMessage('+JSON.stringify(kinds)+'.map(probe));';const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));const worker=new Worker(url);const reply=new Promise(resolve=>{worker.onmessage=e=>{worker.terminate();URL.revokeObjectURL(url);resolve(e.data);};});for(let i=0;i<kinds.length;i++)promise_test(async()=>verify((await reply)[i]),'Worker clone does not invoke '+kinds[i]);
</script>
