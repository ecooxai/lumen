<!doctype html><meta charset="utf-8"><title>Node removeChild conversion and mutation controls</title><pre id="results"></pre><script>

for(const[name,value]of invalid)check('conversion/'+name,errorName(()=>parent.removeChild(value)),'TypeError');

check('success/detached',b.parentNode===null,true);

const r=records[0];check('mutation/type',r&&r.type,'childList');check('mutation/target',!!r&&r.target===parent,true);check('mutation/removed',!!r&&r.removedNodes.length===1&&r.removedNodes[0]===b,true);check('mutation/added-empty',r&&r.addedNodes.length,0);check('mutation/previous',!!r&&r.previousSibling===a,true);check('mutation/next',!!r&&r.nextSibling===c,true);

for(let i=0;i<Math.ceil(serialized.length/256);i++)console.log('LUMEN_AUTHORED_CHUNK '+i+' '+JSON.stringify(serialized.slice(i*256,(i+1)*256)));
console.log('LUMEN_AUTHORED_DONE '+Math.ceil(serialized.length/256));console.log('RESULTS NODE_REMOVECHILD:'+(result.failed?'FAIL':'PASS')+' '+passed+'/'+checks.length);
</script>
