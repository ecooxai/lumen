<!doctype html><meta charset="utf-8"><title>Intrinsic measurement descendant edge restoration</title><style>html,body{margin:0}</style><body><script>
function n(x){return Math.round(x*1000000)/1000000}function emit(v){const s=JSON.stringify(v);let c=0;for(let i=0;i<s.length;i+=256)console.log('LUMEN_AUTHORED_CHUNK '+(c++)+' '+JSON.stringify(s.slice(i,i+256)));console.log('LUMEN_AUTHORED_DONE '+c);console.log('RESULTS INTRINSIC_DESCENDANT_EDGES:PASS')}
setTimeout(function(){const rows=[],cases=[["column","stretch","min-width","max-content","ltr"],["column","stretch","max-width","min-content","ltr"],["column","stretch","min-width","fit-content","ltr"],["column","stretch","max-width","fit-content","ltr"],["row","flex-start","min-width","max-content","ltr"],["row","flex-start","max-width","min-content","ltr"],["column","stretch","max-width","none","ltr"],["column","stretch","max-width","fit-content","rtl"]];for(const c of cases){const [dir,align,prop,value,direction]=c,p=document.createElement('div'),item=document.createElement('div'),outer=document.createElement('span'),inner=document.createElement('span'),leaf=document.createElement('span');p.style.cssText='display:flex;flex-direction:'+dir+';align-items:'+align+';width:160px;height:70px;direction:'+direction;item.style.cssText='flex:none;box-sizing:content-box;border:3px solid;padding:7px;min-width:0;max-width:none;font-size:0;line-height:12px';item.style.setProperty(prop,value);outer.style.cssText='padding-left:10%;padding-right:5%;border:1px solid';inner.style.cssText='padding-left:calc(2px + 5%);padding-right:calc(3px + 2%);border:1px solid';leaf.style.cssText='display:inline-block;width:24px;height:8px';inner.appendChild(leaf);outer.appendChild(inner);item.appendChild(outer);p.appendChild(item);document.body.appendChild(p);
function observe(stage){const a=item.getBoundingClientRect(),b=outer.getBoundingClientRect(),d=inner.getBoundingClientRect(),l=leaf.getBoundingClientRect(),s=getComputedStyle(outer),t=getComputedStyle(inner),u=getComputedStyle(item);rows.push({name:c.join('/')+'/'+stage,values:{itemWidth:n(a.width),itemHeight:n(a.height),outerX:n(b.x-a.x),outerWidth:n(b.width),innerX:n(d.x-a.x),innerWidth:n(d.width),leafX:n(l.x-a.x),leafWidth:n(l.width),outerPadLeft:n(parseFloat(s.paddingLeft)),outerPadRight:n(parseFloat(s.paddingRight)),innerPadLeft:n(parseFloat(t.paddingLeft)),innerPadRight:n(parseFloat(t.paddingRight)),minWidth:u.minWidth,maxWidth:u.maxWidth}})}
observe('initial');observe('repeat-clean');p.style.width='200px';observe('wide');p.style.width='160px';observe('back');outer.style.paddingLeft='20%';observe('padding-mutation');outer.style.paddingLeft='10%';observe('restored');p.remove()}
emit({geometryTolerance:0.00001,rows,total:rows.length*14})},0);
</script></body>
