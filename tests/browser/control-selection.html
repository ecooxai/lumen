<!doctype html><meta charset="utf-8"><title>Native control selection regression</title><style>body{font:14px sans-serif;background:#eef4fa;color:#123;margin:12px}textarea,input{display:block;font:16px monospace;padding:2px;width:300px;height:40px;margin:4px}button{padding:6px}.result{display:inline-block;border:1px solid #789;background:white;margin:3px;padding:5px;font-size:12px}#results{max-width:710px}</style><h1>Native caret and replacement regression</h1><button id="other">Other focus</button><div id="editor"></div><div id="results"></div><script>const checks=[];
function test(fn,name){try{fn();checks.push([name,true])}catch(e){checks.push([name,false,String(e.message||e)])}}
function assert_equals(actual,expected,message){if(actual!==expected)throw new Error((message?message+': ':'')+'expected '+JSON.stringify(expected)+' got '+JSON.stringify(actual))}
function assert_true(value,message){if(value!==true)throw new Error(message||'expected true')}
function done(){window.__astraResult={status:'OK',message:null,subtests:checks.map(x=>[x[0],x[1]?'PASS':'FAIL',x[2]||null])};const failures=checks.filter(x=>!x[1]);const result='RESULTS control-selection:'+(failures.length?'FAIL '+failures.map(x=>x[0]+': '+x[2]).join('; '):'PASS '+checks.length+'/'+checks.length);console.log(result);const report=document.createElement('pre');report.textContent=result;document.body.append(report)}
let seq=0,pending;const logs=[];window.__astraNativeRequest=null;
window.__astraInputDone=function(id){if(pending&&pending.id===id){window.__astraNativeRequest=null;const done=pending.resolve;pending=null;done()}};
function native(ops){if(typeof window.__lumenTd==='function')return window.__lumenTd(ops);return new Promise((resolve,reject)=>{const id=++seq;pending={id,resolve};window.__astraNativeRequest={id,ops};setTimeout(()=>{if(pending&&pending.id===id){pending=null;reject(new Error('Native controller deadline'))}},10000)})}
const type=text=>native(Array.from(text,c=>'key '+c.codePointAt(0)).join('\n'));
async function click(el){const r=el.getBoundingClientRect();await native('move '+Math.round(r.left+r.width/2)+' '+Math.round(r.top+r.height/2)+'\ndown 0\nup 0')}
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

const editor=document.getElementById('editor'),other=document.getElementById('other');
function control(tag='textarea',value='ABCDE'){other.focus();editor.replaceChildren();const e=document.createElement(tag);e.value=value;editor.append(e);return e}
function result(name,e,expected){test(()=>assert_equals(e.value,expected),name);const d=document.createElement('div');d.className='result';d.textContent=name+': '+e.value;document.getElementById('results').append(d)}
const key=cp=>native('key '+cp+'\nkeyup '+cp);
async function replacementBeforeFocus(tag,detached){
 other.focus();editor.replaceChildren();const el=document.createElement(tag);el.value='OLDMESSAGE';const save=document.createElement('button');save.textContent='Save';const view=document.createElement('div');view.textContent='OLDMESSAGE';const name=tag+(detached?' detached':' connected')+' selection before focus';
 if(!detached)editor.append(el,save,view);el.setSelectionRange(0,el.value.length);if(detached)editor.append(el,save,view);el.focus();
 test(()=>{assert_equals(el.selectionStart,0);assert_equals(el.selectionEnd,10)},name+' exposes selected range');await type('NEWMESSAGE');test(()=>assert_equals(el.value,'NEWMESSAGE'),name+' replaces native input');
 save.onclick=()=>view.replaceChildren(document.createTextNode(el.value));await click(save);test(()=>assert_equals(view.textContent,'NEWMESSAGE'),name+' saves only replacement text');
}
(async()=>{await frame();for(const tag of ['textarea','input'])for(const detached of [false,true])await replacementBeforeFocus(tag,detached);let e=control();e.focus();e.setSelectionRange(3,3);await key(57362);const second=document.createElement('input');second.value='OTHER';editor.append(second);second.focus();second.select();e.focus();test(()=>assert_equals(e.selectionStart,2),'Native caret persists across another control focus');await type('X');result('Restored native caret inserts at saved offset',e,'ABXCDE');
 e=control();e.focus();e.setSelectionRange(1,4);const background=document.createElement('textarea');background.value='SECOND';background.select();await type('X');result('Background selection does not steal active control selection',e,'AXE');test(()=>assert_equals(background.value,'SECOND'),'Detached background control remains unchanged');
 e=control();e.focus();await native('key 57360\nkeyup 57360\nkey 57352\nkey 57362\nkeyup 57362\nkeyup 57352');test(()=>{assert_equals(e.selectionStart,4);assert_equals(e.selectionEnd,5)},'End then Shift+Left selects final character');await type('X');result('Native keyboard range replacement',e,'ABCDX');
 e=control();e.focus();await native('key 57353\nkey 97\nkeyup 57353');await type('X');result('Native Control+A replacement',e,'X');
 e=control();e.focus();e.select();await frame();/* Isolate a single click from earlier Save clicks: the existing native testdriver has a global500ms multi-click window. */await new Promise(resolve=>setTimeout(resolve,600));let r=e.getBoundingClientRect();await native('move '+Math.round(r.left+4)+' '+Math.round(r.top+10)+'\ndown 0\nup 0');test(()=>{assert_equals(e.selectionStart,0);assert_equals(e.selectionEnd,0)},'Native click places caret after prior programmatic selection');await type('X');result('Native click caret insertion preserves old text',e,'XABCDE');
 other.focus();editor.replaceChildren();e=document.createElement('textarea');e.textContent='ABCDE';editor.append(e);e.focus();test(()=>assert_equals(e.selectionStart,0),'Initial markup value starts with caret at beginning');await type('X');result('Initial programmatic focus inserts at beginning',e,'XABCDE');
 e=control();e.setSelectionRange(1,2);e.value='XY';e.focus();await type('Z');result('Changed unfocused value moves caret to end',e,'XYZ');
 e=control();e.setSelectionRange(2,2);e.value=e.value;e.focus();await type('X');result('Unchanged unfocused value preserves caret',e,'ABXCDE');
 e=control('textarea','A😀BC');e.setSelectionRange(1,3,'backward');e.focus();test(()=>{assert_equals(e.selectionStart,1);assert_equals(e.selectionEnd,3);assert_equals(e.selectionDirection,'backward')},'Astral-character selection retains UTF-16 boundaries and direction');await type('X');result('Native replacement of selected astral character',e,'AXBC');
 e=control('textarea','A😀BC');e.setSelectionRange(2,2);test(()=>assert_equals(e.selectionStart,2),'Detached/unfocused DOM offset may split a surrogate pair');e.focus();test(()=>assert_equals(e.selectionStart,2),'Focus preserves exact UTF-16 DOM offset');
 e=control();e.setSelectionRange(1,4,'backward');e.focus();e.remove();editor.append(e);e.focus();test(()=>assert_equals(e.selectionDirection,'backward'),'Removal and reattachment preserve selection direction');await type('X');result('Reattached control replaces selected range',e,'AXE');
 e=control();e.setSelectionRange(2,4);const cloned=e.cloneNode(true);editor.replaceChildren(cloned);cloned.focus();test(()=>{assert_equals(cloned.selectionStart,0);assert_equals(cloned.selectionEnd,0)},'Cloned control starts with no inherited selection');await type('X');result('Cloned value receives native input at beginning',cloned,'XABCDE');
 e=control('input','#123456xx');e.type='color';e.type='text';e.focus();test(()=>{assert_equals(e.selectionStart,0);assert_equals(e.selectionEnd,0)},'Changing from nonselectable type resets native selection');await type('X');result('Retyped control receives native input at beginning',e,'X#000000');
 e=control();const form=document.createElement('form');editor.append(form);form.append(e);e.defaultValue='ABCDE';e.value='XYZ';e.focus();e.select();form.reset();test(()=>{assert_equals(e.selectionStart,5);assert_equals(e.selectionEnd,5)},'Form reset synchronizes native caret with reset value');await type('X');result('Reset value receives native input at the reset caret',e,'ABCDEX');
 await frame();done();})().catch(e=>{test(()=>{throw e},'Native caret scenarios complete');done()});
</script>
