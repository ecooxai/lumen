<!doctype html><meta charset="utf-8"><title>Grid placement Typed OM type controls</title><pre id="results">Running</pre><script>
(()=>{const results=[];const type=x=>Object.prototype.toString.call(x).slice(8,-1);const eq=(a,b)=>{if(a!==b)throw new Error(JSON.stringify(a)+' != '+JSON.stringify(b));};const test=(name,fn)=>{try{fn();results.push({name,status:'PASS'});}catch(e){results.push({name,status:'FAIL',message:String(e.message||e)});}};
function check(p,v,wanted,roundtrip=true){const e=document.createElement('div');document.body.append(e);try{e.style.setProperty(p,v);const value=e.attributeStyleMap.get(p);eq(type(value),wanted);const all=e.attributeStyleMap.getAll(p);eq(all.length,1);eq(type(all[0]),wanted);eq(type(CSSStyleValue.parse(p,v)),wanted);const parsed=CSSStyleValue.parseAll(p,v);eq(parsed.length,1);eq(type(parsed[0]),wanted);if(v==='a / a')eq(e.style.getPropertyValue(p),'a');if(roundtrip){const d=document.createElement('div');d.attributeStyleMap.set(p,value);eq(d.style.getPropertyValue(p),e.style.getPropertyValue(p));}}finally{e.remove();}}
for(const p of ['grid-area','grid-row','grid-column'])for(const v of ['a','a / a','auto','2','span 2'])test(p+' ordinary tuple '+v,()=>check(p,v,'CSSStyleValue'));
for(const p of ['grid-row-start','grid-row-end','grid-column-start','grid-column-end']){for(const v of ['2','-2','span 2','2 named'])test(p+' structured line '+v,()=>check(p,v,'CSSStyleValue'));for(const v of ['named','auto'])test(p+' identifier '+v,()=>check(p,v,'CSSKeywordValue',v==='auto'));}
for(const [p,v,t]of [['animation-name','hero','CSSKeywordValue'],['display','grid','CSSKeywordValue'],['width','10px','CSSUnitValue'],['opacity','.5','CSSUnitValue'],['--custom','hello','CSSUnparsedValue']])test(p+' unrelated typed value',()=>check(p,v,t,p!=='animation-name'));
for(const p of ['grid-area','grid-row','grid-column'])for(const v of ['initial','var(--line)'])test(p+' preserves wide or pending value '+v,()=>{const e=document.createElement('div');e.style.setProperty(p,v);const x=e.attributeStyleMap.get(p);if(!(x instanceof CSSStyleValue))throw new Error('not a CSSStyleValue');const d=document.createElement('div');d.attributeStyleMap.set(p,x);eq(d.style.getPropertyValue(p),v);eq(String(CSSStyleValue.parse(p,v)),v);});
for(const p of ['grid-row-start','grid-row-end','grid-column-start','grid-column-end'])test(p+' computed map retains line representation',()=>{const e=document.createElement('div');e.style.setProperty(p,'2');document.body.append(e);try{eq(type(e.computedStyleMap().get(p)),'CSSStyleValue');eq(String(e.computedStyleMap().get(p)),'2');e.style.setProperty(p,'auto');eq(type(e.computedStyleMap().get(p)),'CSSKeywordValue');eq(String(e.computedStyleMap().get(p)),'auto');}finally{e.remove();}});
const rejects=f=>{let ok=false;try{f();}catch(e){if(e instanceof TypeError)ok=true;else throw e;}if(!ok)throw new Error('expected TypeError');};
for(const [from,text,to]of [['grid-row','2','grid-column'],['grid-column','span 2','grid-row'],['grid-area','named','grid-row'],['grid-row-start','2','grid-row-end'],['color','red','background-color']])test(from+' direct value is not assignable to '+to,()=>{const e=document.createElement('div'),d=document.createElement('div');e.style.setProperty(from,text);for(const v of [e.attributeStyleMap.get(from),CSSStyleValue.parse(from,text)]){d.attributeStyleMap.set(from,v);eq(d.style.getPropertyValue(from),e.style.getPropertyValue(from));rejects(()=>d.attributeStyleMap.set(to,v));}});
test('append rejects a direct value owned by another property',()=>{const e=document.createElement('div'),v=CSSStyleValue.parse('color','red');rejects(()=>e.attributeStyleMap.append('animation-name',v));});
test('same-property direct value survives set and append',()=>{const e=document.createElement('div'),v=CSSStyleValue.parse('background-size','10px 20px');e.attributeStyleMap.set('background-size',v);e.attributeStyleMap.append('background-size',v);const values=e.attributeStyleMap.getAll('background-size');eq(values.length,2);eq(String(values[0]),'10px 20px');eq(String(values[1]),'10px 20px');});
test('same-property direct append preserves a CSSOM comma-separated list',()=>{const e=document.createElement('div'),v=CSSStyleValue.parse('background-size','10px 20px');e.attributeStyleMap.set('background-size',v);e.attributeStyleMap.append('background-size',v);eq(e.style.getPropertyValue('background-size'),'10px 20px, 10px 20px');});
window.__typedGridResults=results;const passed=results.filter(r=>r.status==='PASS').length;const marker='RESULTS browser-grid-typed-values:'+(passed===results.length?'PASS':'FAIL')+' '+passed+'/'+results.length;document.getElementById('results').textContent=marker;console.log(marker);for(const r of results)console.log('TYPED_GRID_RESULT '+JSON.stringify(r));})();
</script>
