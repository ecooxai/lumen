<!doctype html>
<meta name="viewport" content="width=device-width">
<title>Opacity scrolling regression</title>
<style>
body { margin:0; padding-top:180px; font:16px sans-serif; background:#fff }
video { position:fixed; top:0; left:0; width:100%; height:160px; object-fit:cover; background:#345 }
.card { height:260px; margin:10px; border:1px solid #aaa; background:linear-gradient(#bce,#eeb); position:relative }
.badge { display:inline-block; margin:5px; padding:8px; background:#258; color:white; border-radius:8px; opacity:.65 }
.label { position:absolute; bottom:15px; left:10px; opacity:.7 }
</style>
<video id="video" src="/video.mp4" muted autoplay loop playsinline></video>
<div id="cards"></div>
<script>
const cards=document.getElementById('cards');
for(let i=0;i<30;i++){
 const card=document.createElement('div');card.className='card';
 card.innerHTML='<h2>Card '+i+'</h2>'+Array.from({length:12},(_,j)=>'<span class="badge">'+j+'</span>').join('')+'<span class="label">Translucent label</span>';
 cards.appendChild(card);
}
const video=document.getElementById('video');
const started=performance.now();
function ready(){
 if(video.currentTime>.5 && video.readyState>=2){
  video.pause();
  setTimeout(()=>fetch('/report',{method:'POST',body:JSON.stringify({fixture:'opacity-scroll',ready:video.paused,time:video.currentTime})}),2000);
 }else if(performance.now()-started<15000) setTimeout(ready,100);
 else fetch('/report',{method:'POST',body:JSON.stringify({fixture:'opacity-scroll',ready:false,error:'media timeout'})});
}
ready();
</script>
