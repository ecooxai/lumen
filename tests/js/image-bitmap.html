<!doctype html><body>
<script>
// createImageBitmap(blob): PNG bytes decode natively to a bitmap of the image's size with straight-alpha pixels
// (the WebGPU samples fetch their textures this way); bytes that are no image reject with InvalidStateError.
(async () => {
  const fail = [], ok = (c, m) => { if (!c) fail.push(m); };
  const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR4nGP4z8AAQg0AD3oDfnfpf5cAAAAASUVORK5CYII='), ch => ch.charCodeAt(0));
  const b = await createImageBitmap(new Blob([png], { type: 'image/png' }));
  ok(b instanceof ImageBitmap && b.width === 2 && b.height === 1, 'size ' + b.width + 'x' + b.height);
  const d = b._.src && b._.src.data, px = d ? [...d].join(',') : '';
  ok(/^255,0,0,255,0,0,(254|255),128$/.test(px), 'pixels ' + px);
  let err = '';
  try { await createImageBitmap(new Blob([new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8, 9])])); } catch (e) { err = e.name; }
  ok(err === 'InvalidStateError', 'bad bytes ' + err);
  console.log('RESULTS image-bitmap:' + (fail.length ? 'FAIL ' + fail.join('; ') : 'PASS'));
})();
</script>
