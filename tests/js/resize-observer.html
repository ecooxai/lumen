<!doctype html><meta charset="utf-8"><title>Resize observer</title>
<style>#parent{width:200px}#target{width:50%;height:30px}.item{width:20px;height:2px}</style>
<div id="parent"><div id="target"></div></div><div id="items"></div><pre id="out">Running…</pre>
<script>
(async()=>{
 const results=[],check=(name,pass,detail)=>results.push({name,pass:!!pass,detail});
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const target=document.getElementById('target'),parent=document.getElementById('parent');
 const received=[];const ro=new ResizeObserver(es=>{for(const e of es)if(e.target===target)received.push(e.contentRect.width)});
 async function width(name,w,change){const before=received.length;change();for(let n=0;n<100&&received.length===before;n++)await wait(20);check(name,received.length>before&&Math.abs(received[received.length-1]-w)<1,received.slice(before));}
 try{
  await width('initial-size',100,()=>ro.observe(target));
  await width('parent-resize',150,()=>parent.style.width='300px');
  await width('raf-resize',120,()=>requestAnimationFrame(()=>parent.style.width='240px'));
  const css=document.createElement('style');document.head.appendChild(css);
  await width('stylesheet-resize',80,()=>css.textContent='#target{width:80px}');
  await width('display-none',0,()=>target.style.display='none');
  await width('display-restore',80,()=>target.style.display='block');
  await width('detach',0,()=>target.remove());
  await width('reattach',80,()=>parent.appendChild(target));
  ro.unobserve(target);const before=received.length;target.style.width='90px';await wait(250);check('unobserve',received.length===before);
  await width('reobserve',90,()=>ro.observe(target));ro.disconnect();
  let reentrant=0;const loop=new ResizeObserver(()=>{reentrant++;if(reentrant===1)target.style.width='110px';});loop.observe(target);for(let i=0;i<100&&reentrant<2;i++)await wait(20);check('callback-resize',reentrant===2,reentrant);loop.disconnect();
  const frame=document.createElement('iframe');frame.srcdoc='<div id="child" style="width:65px;height:10px"></div>';document.body.appendChild(frame);
  let child;for(let i=0;i<100&&!child;i++){await wait(20);child=frame.contentDocument&&frame.contentDocument.getElementById('child')}
  if(!child)throw Error('iframe not ready');
  const cross=[];const foreign=new ResizeObserver(es=>cross.push(es[0].contentRect.width));foreign.observe(child);
  for(let i=0;i<100&&!cross.length;i++)await wait(20);check('iframe-initial',cross[0]===65,cross.slice());
  child.style.width='95px';for(let i=0;i<100&&cross[cross.length-1]!==95;i++)await wait(20);check('iframe-resize',cross[cross.length-1]===95,cross.slice());foreign.disconnect();frame.remove();
  const holder=document.getElementById('items'),many=new ResizeObserver(()=>{});
  for(let i=0;i<500;i++){const el=document.createElement('div');el.className='item';holder.appendChild(el);many.observe(el)}
  await wait(500);
 }catch(e){check('unexpected-error',false,String(e))}
 document.getElementById('out').textContent=JSON.stringify(results,null,2);
 await fetch('/report',{method:'POST',body:JSON.stringify({fixture:'resize-observer',results})});
})();
</script>
