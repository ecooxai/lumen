 function nestedFixture(f,maximum){
  f.set('width:300px;height:auto');f.first.remove();f.second.remove();

  leaf.appendChild(left);leaf.appendChild(right);owner.appendChild(leaf);

   for(let i=0;i<levels.length;i++)near(levels[i].getBoundingClientRect().height,leafHeight+12-i,'nested actual constrained height');

   const r=levels[0].getBoundingClientRect();

  };
