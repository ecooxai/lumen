        console.log(failures.length ? 'RESULTS hidden-scroll-retention:FAIL' : 'RESULTS hidden-scroll-retention:PASS');
        console.log('MEASUREMENTS hidden-scroll-state:COMPLETE ' + JSON.stringify({completed,records:records.length}));
        // Capture completion is separate from the retention result above.
        console.log('RESULTS hidden-scroll-state:PASS');
    } catch (error) {
        console.log('MEASUREMENTS hidden-scroll-state:ERROR ' + String(error));
        console.log('RESULTS hidden-scroll-retention:FAIL ' + String(error));
        console.log('RESULTS hidden-scroll-state:FAIL ' + String(error));
    }
    document.documentElement.setAttribute('data-hidden-scroll-state-complete','1');
})();
</script>
