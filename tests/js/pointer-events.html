<!doctype html>
<html><body><div id="d"></div>
<script>
// PointerEvent and Touch fields, pointer capture for the mouse and unknown pointers, and passive root touch listeners.
const fail = [], ok = (c, m) => { if (!c) fail.push(m); };
try {
  const d = document.getElementById('d');
  const p = new PointerEvent('pointermove', { pointerId: 7, pointerType: 'pen', pressure: .5, tiltX: 10, twist: 30, width: 4, buttons: 1, clientX: 3 });
  ok(p.pointerId === 7 && p.pointerType === 'pen' && p.pressure === .5 && p.tiltX === 10 && p.twist === 30 && p.width === 4, 'fields');
  ok(p.altitudeAngle === Math.PI / 2 && p.azimuthAngle === 0 && p.tangentialPressure === 0, 'angles');
  ok(Array.isArray(p.getCoalescedEvents()) && p.getCoalescedEvents().length === 0 && p.getPredictedEvents().length === 0, 'untrusted coalesced');
  ok(new PointerEvent('pointerdown', { coalescedEvents: [p] }).getCoalescedEvents()[0] === p, 'coalesced init');
  ok(new PointerEvent('pointerdown', { pointerId: 0 }).pointerId === 0, 'pointerId 0');
  ok(new MouseEvent('mousedown', { button: 0 }).which === 1 && new MouseEvent('mousemove', { buttons: 2 }).which === 3, 'which');
  const t = new Touch({ identifier: 3, target: d, clientX: 5, clientY: 6, force: .4 });
  ok(t.identifier === 3 && t.target === d && t.clientX === 5 && t.pageY === 6 + scrollY && t.force === .4, 'Touch');
  let threw = ''; try { new Touch({ identifier: 1 }); } catch (e) { threw = e.name; } ok(threw === 'TypeError', 'Touch target required');
  threw = ''; try { d.setPointerCapture(99); } catch (e) { threw = e.name; } ok(threw === 'NotFoundError', 'unknown pointer ' + threw);
  d.setPointerCapture(1); ok(d.hasPointerCapture(1), 'mouse capture');
  d.releasePointerCapture(1); ok(!d.hasPointerCapture(1), 'mouse release');
  let rootPrevented = null, elPrevented = null;
  document.addEventListener('touchmove', e => { e.preventDefault(); rootPrevented = e.defaultPrevented; });
  d.addEventListener('touchmove', e => { e.preventDefault(); elPrevented = e.defaultPrevented; });
  d.dispatchEvent(new TouchEvent('touchmove', { bubbles: true, cancelable: true }));
  ok(elPrevented === true && rootPrevented === true, 'element listener cancels ' + elPrevented + ' ' + rootPrevented);
  let r2 = null; const f = e => { e.preventDefault(); r2 = e.defaultPrevented; };
  addEventListener('touchstart', f);
  const ev = new TouchEvent('touchstart', { bubbles: true, cancelable: true }); document.body.dispatchEvent(ev);
  ok(r2 === false && !ev.defaultPrevented, 'window touchstart passive by default');
  removeEventListener('touchstart', f); addEventListener('touchstart', f, { passive: false });
  const ev2 = new TouchEvent('touchstart', { bubbles: true, cancelable: true }); document.body.dispatchEvent(ev2);
  ok(ev2.defaultPrevented, 'passive:false cancels');
} catch (e) { fail.push('threw ' + e); }
console.log('RESULTS pointer-events:' + (fail.length ? 'FAIL ' + fail.join('; ') : 'PASS'));
</script></body></html>
