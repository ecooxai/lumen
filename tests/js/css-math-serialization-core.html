<!doctype html><meta charset="utf-8"><title>Specified constant math and EOF tokens</title><body style="font-size:20px"><script>
(()=>{'use strict';let total=0,passed=0;
function check(ok,message){if(!ok)throw Error(message);}
function test(name,fn){total++;try{fn();passed++;console.log('MATH_SERIALIZATION_ROW '+JSON.stringify({name,pass:true}));}catch(e){console.log('MATH_SERIALIZATION_ROW '+JSON.stringify({name,pass:false,error:String(e)}));}}
const values=[
 ['margin-left','min(1px)','calc(1px)'],['margin-left','max(1PX)','calc(1px)'],['margin-left','min(1in)','calc(96px)'],['margin-left','min(50px, 1in + 1px)','calc(50px)'],['margin-left','max(50px, 1in + 1px)','calc(97px)'],['margin-left','calc(1px + min(1in, 100px))','calc(97px)'],['margin-left','calc(1px + max(1in, 100px))','calc(101px)'],['margin-left','clamp(1px, 5px, 3px)','calc(3px)'],['margin-left','clamp(5px, 2px, 3px)','calc(5px)'],['margin-left','min(1cm, 10mm)','calc(37.7953px)'],['margin-left','max(1pt, 1pc)','calc(16px)'],['margin-left','min(4Q, 1mm)','calc(3.77953px)'],['text-indent','min(1px, 2px)','calc(1px)'],['width','max(10px, 5px, 20px, 15px)','calc(20px)'],
 ['transition-delay','min(1ms)','calc(0.001s)'],['transition-delay','max(1s, 200ms)','calc(1s)'],['transition-delay','max(1100ms, 1s)','calc(1.1s)'],['transition-delay','calc(min(1s, 2s) + max(3s, 4s) + 10s)','calc(15s)'],['transition-delay','min(-1s, 2s)','calc(-1s)'],['transition-delay','min(1s), max(2s, 3s)','calc(1s), calc(3s)'],
 ['transform','rotate(min(90deg))','rotate(calc(90deg))'],['transform','rotate(max(.25turn, 80deg))','rotate(calc(90deg))'],['transform','rotate(min(100grad, 0.25turn, 1.58rad))','rotate(calc(90deg))'],['transform','rotate(calc(min(30deg) + max(60deg)))','rotate(calc(90deg))'],['transform','rotate(calc(50grad + min(45deg)))','rotate(calc(90deg))'],
 ['margin-left','calc(1px / min(0, -0))','calc(-infinity * 1px)'],['margin-left','calc(1px / max(0, -0))','calc(infinity * 1px)'],['margin-left','min(NaN * 1px, 1px)','calc(NaN * 1px)'],['margin-left','min(infinity * 1px, 2px)','calc(2px)'],['margin-left','max(-infinity * 1px, -2px)','calc(-2px)'],['margin-left','calc(max(-0, 0) * infinity * 1px)','calc(NaN * 1px)'],
 ['margin-left','min(1px, 1em)','min(1px, 1em)'],['margin-left','max(1px, 1%)','max(1px, 1%)'],['margin-left','var(--MiXeD, min(1px, 2px))','var(--MiXeD, min(1px, 2px))'],['margin-left','calc(min(var(--MiXeD), 10px) * 2)','calc(min(var(--MiXeD), 10px) * 2)']
];
function declaration(path,p,value){if(path==='inline-set'){const e=document.createElement('div');e.style.setProperty(p,value);return e.style;}if(path==='inline-text'){const e=document.createElement('div');e.style.cssText=p+':'+value;return e.style;}const s=new CSSStyleSheet();s.insertRule('div{}');const d=s.cssRules[0].style;if(path==='rule-set')d.setProperty(p,value);else d.cssText=p+':'+value;return d;}
for(const [p,value,expected] of values)for(const path of ['inline-set','inline-text','rule-set','rule-text'])test(path+' '+p+':'+value,()=>{const d=declaration(path,p,value);check(d.getPropertyValue(p)===expected,JSON.stringify(d.getPropertyValue(p))+' != '+JSON.stringify(expected));});
const eof=[['margin-left','calc(min(1em, 21px) * 2','calc(min(1em, 21px) * 2)'],['margin-left','calc(min(1em, 21px) / 2','calc(min(1em, 21px) / 2)'],['margin-left','calc(max(1em, 19px) * 2','calc(max(1em, 19px) * 2)'],['rotate','calc(min(90deg, 1.58rad) * 1.5','calc(min(90deg, 1.58rad) * 1.5)'],['rotate','calc(max(90deg, 1.56rad) + .125turn','calc(max(90deg, 1.56rad) + .125turn)'],['transform','rotate(calc(min(90deg, 1.58rad) / 2','rotate(calc(min(90deg, 1.58rad) / 2))'],['width','max(20px, calc(5px + 5px','max(20px, calc(5px + 5px))'],['margin-left','calc(var(--MiXeD, 12px','calc(var(--MiXeD, 12px))'],['margin-left','calc(var(--MiXeD, min(12px, 14px','calc(var(--MiXeD, min(12px, 14px)))']];
for(const [p,value,complete] of eof.filter(row=>!row[1].includes('var(')))for(const path of ['inline-set','inline-text','rule-set','rule-text'])test(path+' EOF '+p+':'+value,()=>{const expected=declaration(path,p,complete).getPropertyValue(p),d=declaration(path,p,value);check(expected!=='','complete control rejected');check(d.getPropertyValue(p)===expected,JSON.stringify(d.getPropertyValue(p))+' != '+JSON.stringify(expected));check(d.cssText.includes(expected+';'),'semicolon entered unfinished function');});
for(const [p,value,complete] of eof.filter(row=>!row[1].includes('var(')))test('computed EOF '+p+':'+value,()=>{const e=document.createElement('div');document.body.appendChild(e);e.style.setProperty(p,complete);const expected=getComputedStyle(e).getPropertyValue(p);e.style.removeProperty(p);e.style.setProperty(p,value);check(getComputedStyle(e).getPropertyValue(p)===expected,'computed mismatch '+getComputedStyle(e).getPropertyValue(p)+' != '+expected);e.remove();});
const invalid=['calc(1px))','calc(1px]','calc(1px};color:red','calc(1px);color:red','calc(1px) !important','calc(1px; color:red)','min(1px, )','max()','clamp(1px, 2px)','min(1px, "unterminated','min(1px, 2px) garbage'];
for(const value of invalid)for(const path of ['inline-set','rule-set'])test(path+' invalid '+value,()=>{const d=declaration(path,'margin-left','17px');d.setProperty('margin-left','17px','important');const before=d.cssText;d.setProperty('margin-left',value);check(d.cssText===before,'invalid math replaced prior declaration: '+d.cssText);});
test('custom property raw math is not eagerly folded',()=>{const e=document.createElement('div');e.style.setProperty('--MiXeD','min(1px, 2px)');check(e.style.getPropertyValue('--MiXeD')==='min(1px, 2px)','custom token stream simplified');});
const result=passed===total?'PASS':'FAIL';console.log('RESULTS css-math-serialization-core:'+result+' '+JSON.stringify({passed,total}));document.documentElement.setAttribute('data-css-math-serialization-core',result);
})();</script>
