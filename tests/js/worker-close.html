<!doctype html><title>Self-closing worker lifecycle</title>
<script>
const events = [];
const worker = new Worker(URL.createObjectURL(new Blob([
    "onmessage = () => postMessage('unexpected-task'); postMessage('before-close'); close(); postMessage('after-close');"
], { type: 'text/javascript' })));
worker.onmessage = e => events.push(e.data);
setTimeout(() => {
    // A late post must not be delivered or retained once the worker has closed.
    worker.postMessage(new Uint8Array(1024 * 1024));
    setTimeout(() => {
        console.log('RESULTS worker-close ' + (events.join(',') === 'before-close,after-close' ? 'PASS' : 'FAIL') + ' events=' + events.join(','));
        worker.terminate();
        let getterSeen = false;
        const duringClone = new Worker(URL.createObjectURL(new Blob(['onmessage = () => {};'])));
        duringClone.postMessage({ get value() { getterSeen = true; duringClone.terminate(); return 1; } });
        console.log('RESULTS worker-close-getter ' + (getterSeen ? 'PASS' : 'FAIL'));
    }, 200);
}, 500);
</script>
