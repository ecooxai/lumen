<!doctype html>
<meta charset="utf-8">
<title>Fetch and XHR session regression</title>
<body><pre id="results"></pre>
<script>
(async () => {
    const other = '@OTHER_ORIGIN@', here = location.origin;
    let passed = 0, failed = 0, serial = 0;
    const check = (ok, name) => {
        if (ok) passed++; else failed++;
        console.log('FETCH-' + (ok ? 'PASS ' : 'FAIL ') + name);
    };
    const test = async (name, fn) => {
        try { await fn(); } catch (e) { check(false, name + ': ' + e); }
    };
    const hasSession = text => /(?:^|; )lumen_fetch_session=alive(?:;|$)/.test(text || '');
    const url = (origin, path, params = {}) => origin + path + '?' + new URLSearchParams(params);
    const echo = (origin, init = {}, params = {}) => fetch(url(origin, '/echo', { case: 'echo-' + ++serial, ...params }), init).then(r => r.json());
    const xhr = (origin, credentials, sync = false, params = {}, method = 'GET') => new Promise((resolve, reject) => {
        const x = new XMLHttpRequest(); x.open(method, url(origin, '/echo', { case: 'xhr-' + ++serial, ...params }), !sync);
        x.withCredentials = credentials;
        if (method !== 'GET') x.setRequestHeader('X-Lumen-Test', 'credentials');
        x.onload = () => { try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(e); } };
        x.onerror = () => reject(new Error('XHR network error'));
        x.send();
        if (sync) resolve(JSON.parse(x.responseText));
    });
    document.cookie = 'lumen_fetch_session=alive; Path=/; SameSite=Lax';
    await test('Request inheritance', async () => {
        const options = { credentials: 'include', mode: 'same-origin', cache: 'no-store', redirect: 'error', referrer: '', integrity: 'sha256-test', keepalive: true, priority: 'high' };
        const source = new Request(here + '/echo', options);
        for (const [name, value] of Object.entries(options)) {
            check(source[name] === value, 'Request constructor retains ' + name);
            check(source.clone()[name] === value, 'Request.clone retains ' + name);
            check(new Request(source)[name] === value, 'Request copy retains ' + name);
        }
        const override = new Request(source, { credentials: 'omit', keepalive: false, integrity: '' });
        check(override.credentials === 'omit' && !override.keepalive && override.integrity === '' && override.cache === 'no-store', 'Request explicit overrides preserve other options');
        const request = new Request(url(other, '/echo'), { credentials: 'include' });
        check(hasSession((await (await fetch(request)).json()).cookie), 'fetch(Request) retains include credentials');
        const stream = new ReadableStream({ start(c) { c.enqueue(new TextEncoder().encode('session-body')); c.close(); } });
        const body = new Request(here + '/echo', { method: 'POST', body: stream });
        const clone = body.clone();
        const texts = await Promise.all([body.text(), clone.text()]);
        check(texts[0] === 'session-body' && texts[1] === 'session-body', 'Request.clone tees a stream body');
        let threw = false; try { body.clone(); } catch (e) { threw = e instanceof TypeError; }
        check(threw, 'Request.clone rejects a consumed body');
    });
    await test('Fetch cookie modes', async () => {
        check(hasSession((await echo(here)).cookie), 'same-origin Fetch includes the session');
        check(!hasSession((await echo(here, { credentials: 'omit' })).cookie), 'omit Fetch excludes the session on same origin');
        check(!hasSession((await echo(other)).cookie), 'default Fetch excludes cookies on another port');
        check(!hasSession((await echo(other, { credentials: 'same-origin' })).cookie), 'same-origin Fetch excludes cross-origin cookies');
        check(hasSession((await echo(other, { credentials: 'include' })).cookie), 'include Fetch sends cross-origin session');
        await echo(here, { credentials: 'omit' }, { set: 'lumen_omit_response=ignored' });
        check(!document.cookie.includes('lumen_omit_response='), 'omit Fetch ignores response Set-Cookie');
        await echo(other, {}, { set: 'lumen_cross_response=ignored' });
        check(!document.cookie.includes('lumen_cross_response='), 'default cross-origin Fetch ignores response Set-Cookie');
        await echo(other, { credentials: 'include' }, { set: 'lumen_include_response=kept' });
        check(document.cookie.includes('lumen_include_response=kept'), 'include Fetch accepts response Set-Cookie');
    });
    for (const sync of [false, true]) await test((sync ? 'Sync' : 'Async') + ' XHR cookie modes', async () => {
        const kind = sync ? 'sync XHR' : 'async XHR';
        check(hasSession((await xhr(here, false, sync)).cookie), kind + ' default includes same-origin session');
        check(!hasSession((await xhr(other, false, sync)).cookie), kind + ' default excludes cross-origin session');
        check(hasSession((await xhr(other, true, sync)).cookie), kind + ' withCredentials includes cross-origin session');
        const name = 'lumen_xhr_ignored_' + (sync ? 'sync' : 'async');
        await xhr(other, false, sync, { set: name + '=ignored' });
        check(!document.cookie.includes(name + '='), kind + ' without credentials ignores cross-origin Set-Cookie');
        const result = await xhr(other, true, sync, {}, 'PUT');
        check(result.preflightCookie === '', kind + ' preflight sends no cookies');
        check(!document.cookie.includes('lumen_preflight_response='), kind + ' preflight ignores Set-Cookie');
        check(hasSession(result.cookie), kind + ' actual request retains include credentials');
    });
    await test('Fetch preflight', async () => {
        const result = await echo(other, { credentials: 'include', method: 'PUT', headers: { 'X-Lumen-Test': 'credentials' } });
        check(result.preflightCookie === '', 'Fetch preflight sends no cookies');
        check(!document.cookie.includes('lumen_preflight_response='), 'Fetch preflight ignores Set-Cookie');
        check(hasSession(result.cookie), 'Fetch actual request after preflight includes the session');
        const ticket = 'stream-' + ++serial;
        const response = await fetch(url(other, '/stream', { case: ticket }), { method: 'PUT', headers: { 'X-Lumen-Test': 'stream' }, credentials: 'include' });
        await fetch(url(here, '/release', { case: ticket }));
        check(await response.text() === 'released', 'Fetch after preflight exposes streaming response headers');
    });
    await test('Fetch redirect credentials', async () => {
        const run = async (origins, credentials) => {
            const ticket = 'redirect-' + ++serial;
            let target = url(origins[origins.length - 1], '/echo', { case: ticket });
            for (let i = origins.length - 2; i >= 0; i--) target = url(origins[i], '/redirect', { case: ticket, to: target });
            return (await fetch(target, { credentials })).json();
        };
        let result = await run([here, here], 'same-origin');
        check(result.hops.every(h => hasSession(h.cookie)), 'same-origin redirect retains cookies');
        result = await run([here, other], 'same-origin');
        check(hasSession(result.hops[0].cookie) && !hasSession(result.cookie), 'cross-origin redirect drops same-origin cookies');
        result = await run([here, other, here], 'same-origin');
        check(hasSession(result.hops[0].cookie) && result.hops.slice(1).every(h => !hasSession(h.cookie)), 'redirect returning to source remains without same-origin credentials');
        result = await run([other, here], 'same-origin');
        check(result.hops.every(h => !hasSession(h.cookie)), 'cross-origin initial request cannot regain same-origin credentials');
        result = await run([here, other, here], 'include');
        check(result.hops.every(h => hasSession(h.cookie)), 'include credentials survive permitted CORS redirects');
        result = await run([here, other, here], 'omit');
        check(result.hops.every(h => !hasSession(h.cookie)), 'omit credentials apply to every redirect');
    });
    console.log('FETCH-DONE passed=' + passed + ' failed=' + failed);
    document.getElementById('results').textContent = passed + ' passed, ' + failed + ' failed';
    document.documentElement.setAttribute('data-fetch-done', '1');
})();
</script>
