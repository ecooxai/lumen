<!doctype html><meta charset=utf-8>
<title>IntersectionObserver geometry</title>
<!-- rootMargin shorthand, thresholds and ratios, zero-area targets, element roots and clipping ancestors -->
<style>
body{margin:0;height:3000px}
.b{position:absolute;left:0;width:100px;height:100px}
#below{top:1100px}#zero{top:200px;height:0}#half{top:-50px}
#box{position:absolute;top:300px;left:300px;width:200px;height:100px;overflow:hidden}
#inner{position:absolute;top:150px;left:0;width:50px;height:50px}#peek{position:absolute;top:80px;left:0;width:50px;height:40px}
</style>
<div id=below class=b></div><div id=zero class=b></div><div id=half class=b></div>
<div id=box><div id=inner></div><div id=peek></div></div>
<script>
(async () => {
    const fails = [], ok = (c, m) => { if (!c) fails.push(m); };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const take = async (opts, ...els) => {
        const got = new Map(), io = new IntersectionObserver(es => { for (const e of es) got.set(e.target.id, e); }, opts);
        for (const e of els) io.observe(e);
        for (let i = 0; i < 50 && got.size < els.length; i++) await wait(20);
        io.disconnect(); return got;
    };
    const $ = id => document.getElementById(id), vh = innerHeight;
    $('below').style.top = (vh + 100) + 'px';
    let g = await take({}, $('below'), $('zero'), $('half'));
    ok(g.get('below') && !g.get('below').isIntersecting, 'below without margin');
    ok(g.get('zero') && g.get('zero').isIntersecting && g.get('zero').intersectionRatio === 1, 'zero-area target');
    ok(g.get('half') && g.get('half').isIntersecting && Math.abs(g.get('half').intersectionRatio - 0.5) < 0.01, 'half ratio ' + (g.get('half') && g.get('half').intersectionRatio));
    g = await take({ rootMargin: '0px 0px 200px 0px' }, $('below'));
    ok(g.get('below') && g.get('below').isIntersecting, 'bottom rootMargin');
    g = await take({ rootMargin: '0px 0px 50% 0px' }, $('below'));
    ok(g.get('below') && g.get('below').isIntersecting === (vh / 2 >= 100), 'percent rootMargin');
    const io = new IntersectionObserver(() => {}, { rootMargin: '10px 5%', threshold: [1, 0.5] });
    ok(io.rootMargin === '10px 5% 10px 5%' && io.thresholds.join() === '0.5,1', 'normalized ' + io.rootMargin + ' ' + io.thresholds);
    let threw = ''; try { new IntersectionObserver(() => {}, { rootMargin: '10em' }); } catch (e) { threw = e.name; }
    ok(threw === 'SyntaxError', 'bad margin ' + threw);
    threw = ''; try { new IntersectionObserver(() => {}, { threshold: 2 }); } catch (e) { threw = e.name; }
    ok(threw === 'RangeError', 'bad threshold ' + threw);
    g = await take({ threshold: [0.75] }, $('half'));
    ok(g.get('half') && g.get('half').isIntersecting && g.get('half').intersectionRatio < 0.75, 'below threshold still reports intersecting');
    g = await take({}, $('inner'), $('peek'));
    ok(g.get('inner') && !g.get('inner').isIntersecting, 'clipped by overflow');
    ok(g.get('peek') && g.get('peek').isIntersecting && Math.abs(g.get('peek').intersectionRatio - 0.5) < 0.01, 'partly clipped ' + (g.get('peek') && g.get('peek').intersectionRatio));
    g = await take({ root: $('box') }, $('inner'), $('below'));
    ok(g.get('inner') && !g.get('inner').isIntersecting, 'element root excludes');
    ok(g.get('below') && !g.get('below').isIntersecting, 'not a descendant of the root');
    g = await take({ root: $('box'), rootMargin: '0px 0px 100px 0px' }, $('inner'));
    ok(g.get('inner') && g.get('inner').isIntersecting, 'element root with margin');
    ok(typeof IntersectionObserverEntry === 'function' && 'intersectionRatio' in IntersectionObserverEntry.prototype && 'isIntersecting' in IntersectionObserverEntry.prototype, 'entry class (pages polyfill without it)');
    ok(g.get('inner') instanceof IntersectionObserverEntry, 'entries are IntersectionObserverEntry');
    console.log(fails.length ? 'RESULTS intersection-geometry:FAIL ' + fails.join('; ') : 'RESULTS intersection-geometry:PASS');

    // Authored diagnostic: retain all existing geometry assertions above, then
    // inspect actual-layout transitions immediately after observer delivery.
    // Use the ordinary native layout and observer pipelines for this control.
    try {
        const cadenceFails = [], records = [], frames = [];
        const note = value => console.log('DIAGNOSTIC io-frame-cadence ' + JSON.stringify(value));
        const require = (condition, message) => { if (!condition) cadenceFails.push(message); };
        const scroller = document.createElement('div'), target = document.createElement('div');
        scroller.style.cssText = 'position:absolute;left:600px;top:120px;width:120px;height:100px;overflow:auto';
        target.style.cssText = 'margin-top:200px;width:40px;height:20px';
        const tail = document.createElement('div'); tail.style.height = '200px';
        scroller.appendChild(target); scroller.appendChild(tail); document.body.appendChild(scroller);
        let geometryReads = 0, nextDelivery = null;
        const originalRect = target.getBoundingClientRect.bind(target);
        target.getBoundingClientRect = function () { geometryReads++; return originalRect(); };
        const observed = new IntersectionObserver(es => {
            for (const e of es) records.push({ time: performance.now(), intersecting: e.isIntersecting,
                ratio: e.intersectionRatio, top: e.boundingClientRect.top, scrollTop: scroller.scrollTop });
            note({phase:'callback', records:records.slice(-es.length)});
            if (nextDelivery) { const deliver = nextDelivery; nextDelivery = null; deliver(); }
        });
        const delivery = action => new Promise((resolve, reject) => {
            const timeout = setTimeout(() => { nextDelivery = null; reject(new Error('no observer delivery within 1000 ms')); }, 1000);
            nextDelivery = () => { clearTimeout(timeout); resolve(); };
            action();
        });
        const twoFrames = () => new Promise(resolve => requestAnimationFrame(stamp => {
            frames.push({stamp, now:performance.now()});
            requestAnimationFrame(stamp => { frames.push({stamp, now:performance.now()}); resolve(); });
        }));
        await delivery(() => {
            const before = records.length; observed.observe(target);
            require(records.length === before, 'observe must deliver asynchronously');
        });
        require(records.length === 1 && !records[0].intersecting, 'initial target outside element scroller');
        const transition = async (name, mutate, expected) => {
            const first = records.length, firstFrame = frames.length, start = performance.now();
            mutate();
            await twoFrames();
            const byTwoFrames = records.slice(first);
            note({phase:name, start, end:performance.now(), frames:frames.slice(firstFrame),
                expected, records:byTwoFrames, geometryReads, scrollTop:scroller.scrollTop});
            require(byTwoFrames.length === 1 && byTwoFrames[0].intersecting === expected,
                name + ': expected one changed observation within two rendering opportunities');
            if (!byTwoFrames.length) await delivery(() => {});
            require(records.length === first + 1 && records[records.length - 1].intersecting === expected,
                name + ': eventual actual-layout state');
        };
        // Each next transition follows the preceding completed observation.
        // Delaying first would allow the old 50 ms cap to expire and hide it.
        await transition('scroll-enter', () => { scroller.scrollTop = 200; }, true);
        await transition('scroll-exit', () => { scroller.scrollTop = 0; }, false);
        await transition('scroll-enter-again', () => { scroller.scrollTop = 200; }, true);
        await transition('ancestor-hidden', () => { scroller.style.contentVisibility = 'hidden'; }, false);
        // Unhiding does not establish a particular scroll offset. Restore the
        // intended real geometry explicitly; this probe does not test retention.
        await transition('ancestor-visible', () => {
            scroller.style.contentVisibility = 'visible'; scroller.scrollTop = 200;
        }, true);
        await wait(100);
        const idle = {start:performance.now(), geometryReads, notifications:records.length};
        note({phase:'idle-start', ...idle});
        await wait(3300);
        const idleResult = {phase:'idle-end', elapsed:performance.now()-idle.start,
            geometryReads:geometryReads-idle.geometryReads, notifications:records.length-idle.notifications};
        note(idleResult);
        require(idleResult.geometryReads === 0, 'quiescent observed content must not rescan geometry');
        require(idleResult.notifications === 0, 'quiescent content must not generate duplicate entries');
        observed.unobserve(target);
        const stoppedReads = geometryReads, stoppedRecords = records.length;
        target.style.marginTop = '300px'; scroller.scrollTop = 0;
        await twoFrames(); await wait(80);
        require(geometryReads === stoppedReads && records.length === stoppedRecords,
            'unobserving the final target must stop scans and deliveries');
        await delivery(() => {
            const before = records.length; observed.observe(target);
            require(records.length === before, 'reobserve remains asynchronous');
        });
        require(!records[records.length - 1].intersecting, 'reobserve gets a fresh initial offscreen observation');
        observed.disconnect();
        const disconnected = {reads:geometryReads, records:records.length};
        scroller.scrollTop = 300; await twoFrames(); await wait(80);
        require(geometryReads === disconnected.reads && records.length === disconnected.records,
            'disconnect must stop scans and deliveries');
        note({phase:'complete', failures:cadenceFails, geometryReads, notifications:records.length});
        console.log(cadenceFails.length ? 'RESULTS io-frame-cadence:FAIL ' + cadenceFails.join('; ') : 'RESULTS io-frame-cadence:PASS');
        // One aggregate marker requires both independent groups to succeed.
        console.log(!fails.length && !cadenceFails.length ? 'RESULTS intersection-geometry-cadence:PASS' : 'RESULTS intersection-geometry-cadence:FAIL');
    } catch (error) {
        console.log('RESULTS io-frame-cadence:FAIL ' + String(error));
    }
    document.documentElement.setAttribute('data-io-cadence-complete', '1');
})();
</script>
