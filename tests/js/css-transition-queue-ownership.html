<!doctype html><meta charset="utf-8"><title>CSS transition queue ownership</title>
<style>html,body{margin:0;padding:0}</style>
<body>
<script>
(async()=>{
 const rows=[],owned=[],frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
 const eq=(a,b,m)=>{if(a!==b)throw Error(m+': '+JSON.stringify(a)+' expected '+JSON.stringify(b));};
 const near=(a,b,m)=>{if(!Number.isFinite(a)||Math.abs(a-b)>.03)throw Error(m+': '+a+' expected '+b);};
 const check=async(name,fn)=>{try{await fn();rows.push({name,pass:true});}catch(e){rows.push({name,pass:false,error:String(e)});}finally{for(const el of owned.splice(0)){for(const a of el.getAnimations())a.cancel();el.remove();}await frame();}};
 const make=(list='opacity, opacity',left=60)=>{const el=document.createElement('div');el.style.cssText='position:absolute;left:'+left+'px;top:40px;width:100px;height:50px;margin:0;padding:0;border:0;opacity:0.2;transition-property:'+list+';transition-duration:4s,8s,12s;transition-delay:1s,2s,3s;transition-timing-function:linear';document.body.appendChild(el);owned.push(el);eq(getComputedStyle(el).opacity,'0.2','initial opacity');return el;};
 const one=(el,property)=>{const all=el.getAnimations().filter(a=>a.transitionProperty===property);eq(all.length,1,'one '+property+' transition');return all[0];};
 const timing=(a,duration,delay)=>{const t=a.effect.getTiming();eq(t.duration,duration,'duration index');eq(t.delay,delay,'delay index');};
 const sample=(a,p=.5)=>{const t=a.effect.getTiming();a.pause();a.currentTime=t.delay+t.duration*p;};
 const begin=async(el,width=false,sync=true)=>{await frame();if(width)el.style.width='140px';el.style.opacity='0.8';if(sync)getComputedStyle(el).opacity;await frame();};
 const geometry=el=>{const r=el.getBoundingClientRect();eq(document.elementFromPoint(r.left+2,r.top+2),el,'actual layout hit');return r;};
 await check('duplicate names keep one transition across synchronous reads',async()=>{const el=make();await begin(el);const a=one(el,'opacity');timing(a,8000,2000);sample(a);for(let i=0;i<5;i++){near(+getComputedStyle(el).opacity,.5,'real sampled opacity');near(geometry(el).width,100,'real width');eq(one(el,'opacity'),a,'same transition identity');}});
 await check('explicit then all retains two independent property transitions',async()=>{const el=make('opacity, all');await begin(el,true);const a=one(el,'opacity'),w=one(el,'width');eq(el.getAnimations().length,2,'only changed properties');timing(a,8000,2000);timing(w,8000,2000);sample(a);sample(w);near(+getComputedStyle(el).opacity,.5,'sampled opacity');near(geometry(el).width,120,'sampled width');eq(one(el,'opacity'),a,'opacity identity');eq(one(el,'width'),w,'width identity');});
 await check('all then explicit uses the last matching duration without orphaning',async()=>{const el=make('all, opacity');await begin(el,true);const a=one(el,'opacity'),w=one(el,'width');timing(a,8000,2000);timing(w,4000,1000);sample(a);sample(w);near(geometry(el).width,120,'sampled width');near(+getComputedStyle(el).opacity,.5,'sampled opacity');eq(el.getAnimations().length,2,'exact two live objects');});
 await check('asynchronous style delivery keeps one object and one run event',async()=>{const el=make('opacity, opacity');let runs=0;el.addEventListener('transitionrun',e=>{if(e.propertyName==='opacity')runs++;});await begin(el,false,false);await frame();const a=one(el,'opacity');timing(a,8000,2000);eq(runs,1,'one public run event');sample(a);near(+getComputedStyle(el).opacity,.5,'sampled async transition');eq(one(el,'opacity'),a,'async identity after read');});
 await check('two elements retain separate transition ownership during interleaved reads',async()=>{const ael=make('opacity, opacity',60),bel=make('opacity, all',240);await frame();ael.style.opacity='0.8';bel.style.opacity='0.8';getComputedStyle(ael).opacity;getComputedStyle(bel).opacity;await frame();const a=one(ael,'opacity'),b=one(bel,'opacity');if(a===b)throw Error('targets share one animation');sample(a);sample(b);for(let i=0;i<3;i++){geometry(bel);near(+getComputedStyle(ael).opacity,.5,'first element opacity');geometry(ael);near(+getComputedStyle(bel).opacity,.5,'second element opacity');eq(one(ael,'opacity'),a,'first owner');eq(one(bel,'opacity'),b,'second owner');}});
 await check('a new author property is retained while another transition is sampled',async()=>{const el=make('opacity, all');await begin(el);const a=one(el,'opacity');sample(a);near(+getComputedStyle(el).opacity,.5,'initial paused opacity');el.style.width='140px';getComputedStyle(el).width;await frame();const w=one(el,'width');sample(w);near(geometry(el).width,120,'new width transition');near(+getComputedStyle(el).opacity,.5,'existing opacity sample');eq(one(el,'opacity'),a,'existing property identity retained');eq(el.getAnimations().length,2,'author change not swallowed');});
 await check('cancellation clears ownership before a later author change',async()=>{const el=make();await begin(el);const old=one(el,'opacity');sample(old);near(+getComputedStyle(el).opacity,.5,'old sample');old.cancel();eq(getComputedStyle(el).opacity,'0.8','underlying value after cancel');eq(el.getAnimations().length,0,'no cancelled orphan');el.style.opacity='0.4';getComputedStyle(el).opacity;await frame();const next=one(el,'opacity');if(next===old)throw Error('cancelled object reused');sample(next);near(+getComputedStyle(el).opacity,.6,'later author endpoint retained');eq(one(el,'opacity'),next,'new owner remains stable');});
 await check('cancelling both changed properties leaves no active duplicate objects',async()=>{const el=make('all, opacity, all');await begin(el,true);const a=one(el,'opacity'),w=one(el,'width');sample(a);sample(w);near(geometry(el).width,120,'width before cancel');a.cancel();w.cancel();eq(getComputedStyle(el).opacity,'0.8','final author opacity');near(geometry(el).width,140,'final author width');await frame();eq(el.getAnimations().length,0,'all property owners cancelled');});
 for(const row of rows)console.log('TRANSITION_QUEUE_ROW '+JSON.stringify(row));
 const passed=rows.filter(r=>r.pass).length,ok=rows.length===8&&passed===8;
 document.documentElement.setAttribute('data-css-transition-queue-ownership',ok?'PASS':'FAIL');
 console.log('RESULTS css-transition-queue-ownership:'+(ok?'PASS':'FAIL')+' '+JSON.stringify({passed,total:rows.length}));
})().catch(error=>{document.documentElement.setAttribute('data-css-transition-queue-ownership','FAIL');console.log('RESULTS css-transition-queue-ownership:FAIL '+JSON.stringify({error:String(error)}));});
</script>
