<!doctype html><meta charset="utf-8"><title>Rendered-text mutation contract</title><body><div id="stage"></div><script>
(()=>{'use strict';let total=0,passed=0;const stage=document.getElementById('stage');
const descriptor=Object.getOwnPropertyDescriptor,inner=descriptor(HTMLElement.prototype,'innerText'),outer=descriptor(HTMLElement.prototype,'outerText');
function check(value,message){if(!value)throw Error(message);}
function equal(actual,expected,message){check(JSON.stringify(actual)===JSON.stringify(expected),message+': '+JSON.stringify(actual)+' != '+JSON.stringify(expected));}
function raises(name,f){let error;try{f();}catch(e){error=e;}check(error&&error.name===name,'expected '+name+', got '+String(error));}
function test(name,f){total++;try{f();passed++;console.log('TEXT_MUTATION_ROW '+JSON.stringify({name,pass:true}));}catch(e){console.log('TEXT_MUTATION_ROW '+JSON.stringify({name,pass:false,error:String(e.stack||e)}));}}
const el=(tag='div',doc=document)=>doc.createElement(tag);
const shape=n=>Array.from(n.childNodes,c=>c.nodeType===3?'T:'+c.data:c.nodeType===4?'C:'+c.data:c.localName);
function setInner(n,v){Reflect.apply(inner.set,n,[v]);}
function setOuter(n,v){Reflect.apply(outer.set,n,[v]);}
function outerCase(value){const p=el(),n=el('span');p.appendChild(n);setOuter(n,value);check(n.parentNode===null,'target removed');return p;}
test('prototype accessors exist',()=>{check(typeof inner.get==='function'&&typeof inner.set==='function'&&typeof outer.get==='function'&&typeof outer.set==='function','getters and setters');check(inner.enumerable&&inner.configurable&&outer.enumerable&&outer.configurable,'IDL flags');});
for(const [name,value,expected] of [
 ['plain','abc',['T:abc']],['empty','',[]],['null',null,[]],['undefined',undefined,['T:undefined']],
 ['LF','a\nb',['T:a','br','T:b']],['CRLF','a\r\nb',['T:a','br','T:b']],['CR','a\rb',['T:a','br','T:b']],
 ['consecutive','\n\nx\r',['br','br','T:x','br']],['CR then CRLF','x\r\r\ny',['T:x','br','br','T:y']],
 ['literal markup','<b>x</b>&',['T:<b>x</b>&']],['NUL','a\u0000b',['T:a\u0000b']],['tabs','a\tb',['T:a\tb']],['unpaired surrogate','a\ud800b',['T:a\ud800b']]
])test('inner '+name,()=>{const n=el();n.innerHTML='<b>old</b>';const old=n.firstChild;setInner(n,value);equal(shape(n),expected,'fragment shape');check(old.parentNode===null,'old child removed');for(const c of n.childNodes){check(c.ownerDocument===document,'owner document');if(c.nodeType===1)check(c.namespaceURI==='http://www.w3.org/1999/xhtml','HTML namespace');}});
test('inner replacement has fresh text identity',()=>{const n=el(),t=document.createTextNode('same');n.appendChild(t);setInner(n,'same');check(n.firstChild!==t&&t.parentNode===null,'must replace, not update existing text');});
test('inner empty does not insert empty Text',()=>{const n=el();setInner(n,'');check(n.childNodes.length===0,'zero nodes');});
test('inner void element still receives DOM children',()=>{const n=el('img');setInner(n,'a\nb');equal(shape(n),['T:a','br','T:b'],'void-element DOM');});
test('inner uses owning detached document',()=>{const d=document.implementation.createHTMLDocument('other'),n=el('div',d);setInner(n,'a\nb');check(Array.from(n.childNodes).every(c=>c.ownerDocument===d),'owning document');});
test('inner Symbol conversion throws without mutation',()=>{const n=el();n.textContent='old';const t=n.firstChild;raises('TypeError',()=>setInner(n,Symbol('x')));check(n.firstChild===t&&t.data==='old','unchanged on conversion failure');});
test('inner string coercion occurs once with string hint',()=>{const n=el();let calls=0;setInner(n,{[Symbol.toPrimitive](hint){calls++;check(hint==='string','string hint');return 'a\nb';}});check(calls===1,'one conversion');equal(shape(n),['T:a','br','T:b'],'coerced fragment');});
test('inner branded receiver before coercion',()=>{let calls=0;raises('TypeError',()=>setInner({}, {toString(){calls++;return 'x';}}));check(calls===0,'brand before conversion');});
test('inner SVG receiver rejected',()=>raises('TypeError',()=>setInner(document.createElementNS('http://www.w3.org/2000/svg','svg'),'x')));
test('inner Proxy receiver rejected',()=>raises('TypeError',()=>setInner(new Proxy(el(),{}),'x')));
test('inner ignores own textContent setter',()=>{const n=el();Object.defineProperty(n,'textContent',{set(){throw Error('public textContent setter called');}});setInner(n,'a\nb');equal(shape(n),['T:a','br','T:b'],'native operation');});
test('inner ignores own replaceChildren method',()=>{const n=el();n.replaceChildren=()=>{throw Error('public replaceChildren called');};setInner(n,'a\nb');equal(shape(n),['T:a','br','T:b'],'private replace-all');});
test('inner mutation record groups replacement',()=>{const n=el();n.innerHTML='<b>a</b><i>b</i>';const before=Array.from(n.childNodes),mo=new MutationObserver(()=>{});mo.observe(n,{childList:true});setInner(n,'a\nb');const records=mo.takeRecords();mo.disconnect();check(records.length===1,'one replacement record');const r=records[0];check(r.type==='childList'&&r.target===n&&r.previousSibling===null&&r.nextSibling===null,'record metadata');check(r.removedNodes.length===2&&r.removedNodes[0]===before[0]&&r.removedNodes[1]===before[1],'removed identities');check(r.addedNodes.length===n.childNodes.length&&Array.from(r.addedNodes).every((node,index)=>node===n.childNodes[index]),'added identities');});
test('inner replacement updates live Range',()=>{const n=el();n.innerHTML='<span>abcd</span>';const r=document.createRange();r.setStart(n.firstChild.firstChild,1);r.setEnd(n.firstChild.firstChild,3);setInner(n,'x\ny');check(r.startContainer===n&&r.endContainer===n&&r.startOffset===0&&r.endOffset===0,'range collapses to parent boundary');});
for(const [name,value,expected] of [['plain','abc',['T:abc']],['LF','a\nb',['T:a','br','T:b']],['CRLF','a\r\nb',['T:a','br','T:b']],['empty','',['T:']],['null',null,['T:']],['undefined',undefined,['T:undefined']]])test('outer '+name,()=>equal(shape(outerCase(value)),expected,'outer fragment'));
test('outer detached node throws',()=>raises('NoModificationAllowedError',()=>setOuter(el(),'x')));
test('outer string conversion precedes parent check',()=>{let calls=0;raises('NoModificationAllowedError',()=>setOuter(el(),{toString(){calls++;return 'x';}}));check(calls===1,'converted before parent check');});
test('outer observes parent removal during conversion',()=>{const p=el(),n=el();p.appendChild(n);raises('NoModificationAllowedError',()=>setOuter(n,{toString(){n.remove();return 'x';}}));check(!p.firstChild,'coercion side effect retained');});
test('outer observes parent insertion during conversion',()=>{const p=el(),n=el();setOuter(n,{toString(){p.appendChild(n);return 'x';}});equal(shape(p),['T:x'],'live parent after conversion');});
test('outer invalid receiver precedes coercion',()=>{let calls=0;raises('TypeError',()=>setOuter({}, {toString(){calls++;return 'x';}}));check(calls===0,'receiver brand first');});
test('outer Symbol throws before parent error',()=>raises('TypeError',()=>setOuter(el(),Symbol('x'))));
test('outer SVG receiver rejected',()=>raises('TypeError',()=>setOuter(document.createElementNS('http://www.w3.org/2000/svg','svg'),'x')));
test('outer preserves immediate previous text identity',()=>{const p=el(),a=document.createTextNode('A'),n=el(),b=document.createTextNode('B');p.append(a,n,b);setOuter(n,'X');check(p.childNodes.length===1&&p.firstChild===a&&a.data==='AXB','two-sided merge');check(b.parentNode===null,'next text removed');});
test('outer merges only immediate boundary text nodes',()=>{const p=el(),a=document.createTextNode('A'),b=document.createTextNode('B'),n=el(),c=document.createTextNode('C'),d=document.createTextNode('D');p.append(a,b,n,c,d);setOuter(n,'X');check(p.childNodes.length===3&&p.childNodes[0]===a&&p.childNodes[1]===b&&p.childNodes[2]===d,'no broad normalize');equal(shape(p),['T:A','T:BXC','T:D'],'boundary merge shape');});
test('outer line breaks block cross-boundary merge',()=>{const p=el(),a=document.createTextNode('A'),n=el(),b=document.createTextNode('B');p.append(a,n,b);setOuter(n,'\nX\n');equal(shape(p),['T:A','br','T:X','br','T:B'],'break boundaries');check(p.firstChild===a&&p.lastChild===b,'neighbor identities retained');});
test('outer empty merges immediate text neighbors',()=>{const p=el(),a=document.createTextNode('A'),n=el(),b=document.createTextNode('B');p.append(a,n,b);setOuter(n,'');check(p.childNodes.length===1&&p.firstChild===a&&a.data==='AB','empty replacement merge');});
test('outer supports DocumentFragment parent',()=>{const p=document.createDocumentFragment(),n=el();p.appendChild(n);setOuter(n,'a\nb');equal(shape(p),['T:a','br','T:b'],'fragment parent');});
test('outer document hierarchy failure leaves root intact',()=>{const d=document.implementation.createHTMLDocument('other'),root=d.documentElement;raises('HierarchyRequestError',()=>setOuter(root,'x'));check(d.documentElement===root&&root.parentNode===d,'pre-insertion validation');});
test('outer ignores public replacement and normalization methods',()=>{const p=el(),n=el(),a=document.createTextNode('A');p.append(a,n);p.replaceChild=p.normalize=n.replaceWith=()=>{throw Error('author method called');};setOuter(n,'X');check(p.firstChild===a&&a.data==='AX','internal mutation');});
test('outer mutation records preserve merge order',()=>{const p=el(),a=document.createTextNode('A'),n=el(),b=document.createTextNode('B');p.append(a,n,b);const mo=new MutationObserver(()=>{});mo.observe(p,{childList:true,characterData:true,characterDataOldValue:true,subtree:true});setOuter(n,'X');const r=mo.takeRecords();mo.disconnect();check(r.length===5,'replacement plus two data/remove pairs');equal(r.map(x=>x.type),['childList','characterData','childList','characterData','childList'],'record order');check(r[0].removedNodes[0]===n&&r[0].previousSibling===a&&r[0].nextSibling===b,'replacement metadata');check(r[1].target===r[0].addedNodes[0]&&r[1].oldValue==='X'&&r[2].removedNodes[0]===b,'right merge');check(r[3].target===a&&r[3].oldValue==='A'&&r[4].removedNodes[0]===r[0].addedNodes[0],'left merge');});
test('outer merge preserves Range mutation semantics',()=>{const p=el(),a=document.createTextNode('A'),n=el(),b=document.createTextNode('B');p.append(a,n,b);const r=document.createRange();r.setStart(b,1);r.setEnd(b,1);setOuter(n,'X');check(r.startContainer===p&&r.endContainer===p&&r.startOffset===1&&r.endOffset===1,'removed-text range boundary');});
test('getters share rendered text behavior',()=>{const n=el();n.innerHTML='a<br>b';stage.appendChild(n);try{check(inner.get.call(n)==='a\nb','inner rendered text');check(outer.get.call(n)===inner.get.call(n),'getter parity');}finally{n.remove();}});
test('getter invalid brands throw',()=>{raises('TypeError',()=>inner.get.call({}));raises('TypeError',()=>outer.get.call(document.createElementNS('http://www.w3.org/2000/svg','svg')));});
test('inner custom-element reaction sees completed replacement',()=>{let seen;const host=el();class C extends HTMLElement{disconnectedCallback(){seen={html:host.innerHTML,length:host.childNodes.length};}}customElements.define('x-rendered-inner',C);host.appendChild(el('x-rendered-inner'));stage.appendChild(host);try{setInner(host,'a\nb');equal(seen,{html:'a<br>b',length:3},'reaction observes final replacement');}finally{host.remove();}});
test('outer custom-element reaction sees completed merges',()=>{let seen;const host=el();class C extends HTMLElement{disconnectedCallback(){seen={text:host.textContent,length:host.childNodes.length};}}customElements.define('x-rendered-outer',C);const n=el('x-rendered-outer');host.append('A',n,'B');stage.appendChild(host);try{setOuter(n,'X');equal(seen,{text:'AXB',length:1},'reaction observes final merges');}finally{host.remove();}});
test('inner does not call overridden global String',()=>{const n=el(),old=globalThis.String;try{globalThis.String=()=>{throw Error('global String called');};setInner(n,'a\nb');}finally{globalThis.String=old;}equal(shape(n),['T:a','br','T:b'],'intrinsic string conversion');});
test('inner uses intrinsic string splitting',()=>{const n=el(),names=['slice','split','replace','charCodeAt'],old=names.map(k=>descriptor(String.prototype,k));try{names.forEach(k=>Object.defineProperty(String.prototype,k,{...descriptor(String.prototype,k),value(){throw Error('author String method called');}}));setInner(n,'a\r\nb');}finally{names.forEach((k,i)=>Object.defineProperty(String.prototype,k,old[i]));}equal(shape(n),['T:a','br','T:b'],'private fragment splitting');});
test('inner does not call public document creation methods',()=>{const n=el(),names=['createElement','createTextNode','createDocumentFragment'],old=names.map(k=>descriptor(document,k));try{names.forEach(k=>Object.defineProperty(document,k,{configurable:true,value(){throw Error('author document method called');}}));n.appendChild=()=>{throw Error('author appendChild called');};setInner(n,'a\nb');}finally{names.forEach((k,i)=>{if(old[i])Object.defineProperty(document,k,old[i]);else delete document[k];});}equal(shape(n),['T:a','br','T:b'],'private fragment construction');});
const result=passed===total?'PASS':'FAIL';console.log('RESULTS rendered-text-mutation:'+result+' '+JSON.stringify({passed,total}));document.documentElement.setAttribute('data-rendered-text-mutation',result);
})();</script>
