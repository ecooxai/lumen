<!doctype html><html><body>
<div id="a" style="display:flex;flex-direction:column;flex-wrap:wrap;justify-content:space-between;align-items:center;align-self:flex-end;order:2;text-align:center;white-space:nowrap;float:left;text-transform:uppercase;font-style:italic;vertical-align:middle;object-fit:cover;text-overflow:ellipsis;word-break:break-all;cursor:pointer;user-select:none"></div>
<div id="b"></div>
<script>
const r = {}, check = (id, want) => { const cs = getComputedStyle(document.getElementById(id)); for (const [k, v] of Object.entries(want)) r[id + '.' + k] = cs[k] === v ? 'PASS' : 'FAIL(' + cs[k] + ')'; };
check('a', { flexDirection: 'column', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', alignSelf: 'flex-end', order: '2', textAlign: 'center', whiteSpace: 'nowrap', cssFloat: 'left', textTransform: 'uppercase', fontStyle: 'italic', verticalAlign: 'middle', objectFit: 'cover', textOverflow: 'ellipsis', wordBreak: 'break-all', cursor: 'pointer', userSelect: 'none' });
check('b', { flexDirection: 'row', flexWrap: 'nowrap', justifyContent: 'normal', alignItems: 'normal', alignSelf: 'auto', order: '0', textAlign: 'start', whiteSpace: 'normal', cssFloat: 'none', textTransform: 'none', fontStyle: 'normal', verticalAlign: 'baseline', objectFit: 'fill', textOverflow: 'clip', wordBreak: 'normal', cursor: 'auto', userSelect: 'auto' });
console.log('RESULTS ' + Object.entries(r).map(([k, v]) => k + ':' + v).join(' '));
</script></body></html>
