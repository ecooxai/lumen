<!doctype html><meta charset="utf-8"><title>Minimum-size token and serialization contract</title><body><script>
(()=>{'use strict';let total=0,passed=0;
function check(ok,message){if(!ok)throw Error(message);}
function test(name,fn){total++;try{fn();passed++;console.log('MIN_TOKEN_ROW '+JSON.stringify({name,pass:true}));}catch(e){console.log('MIN_TOKEN_ROW '+JSON.stringify({name,pass:false,error:String(e)}));}}
const properties=['min-width','min-height','min-inline-size','min-block-size'];
const invalid=[String.raw`calc(10p\78 + 2px)`,'calc(1px/**/+/**/2px)','1/**/px','1px + 2px','1px/2','1px*2',String.raw`min(1p\78\2c 2px)`,String.raw`calc(1p\78\2f 2)`,String.raw`1p\78\20`,'clamp(none, 0, none)','clamp(0px, none, 10px)','clamp(none, 1px, none, 2px)'];
const serialized=[[String.raw`calc(10p\78  + 2px)`,'calc(12px)','12px'],[String.raw`10p\78`,'10px','10px'],[String.raw`m\69 n-content`,'min-content','min-content'],['calc(10px + 2px','calc(12px)','12px'],['MIN-CONTENT','min-content','min-content'],['0','0px','0px'],['-0','0px','0px'],[' /* lead */ 10px /* tail */ ','10px','10px'],['calc(-1px)','calc(-1px)','0px']];
for(const p of properties){
 for(const value of invalid)test(p+' invalid token '+value,()=>{const e=document.createElement('div');e.style.setProperty(p,'17px','important');e.style.setProperty(p,value);check(e.style.getPropertyValue(p)==='17px'&&e.style.getPropertyPriority(p)==='important','invalid setter changed prior declaration');check(!CSS.supports(p,value)&&!CSS.supports('('+p+':'+value+')'),'supports accepted invalid tokens');e.style.cssText=p+':17px;'+p+':'+value;check(e.style.getPropertyValue(p)==='17px','declaration list accepted invalid tokens');});
 for(const [value,expected,computed] of serialized)test(p+' serialization '+value,()=>{const e=document.createElement('div');e.style.setProperty(p,value);check(e.style.getPropertyValue(p)===expected,'specified '+e.style.getPropertyValue(p)+' != '+expected);check(CSS.supports(p,value)&&CSS.supports('('+p+':'+value+')'),'valid token rejected');const text=e.style.cssText;e.style.cssText=text;check(e.style.getPropertyValue(p)===expected,'round trip changed value');document.body.appendChild(e);try{check(getComputedStyle(e).getPropertyValue(p)===computed,'computed '+getComputedStyle(e).getPropertyValue(p)+' != '+computed);}finally{e.remove();}});
 // Syntax checks deliberately do not assert document-dependent font metrics.
 for(const value of ['1rcap','1rex','1ric','1rch','1rlh','1svmin','1cqmax'])test(p+' unit syntax '+value,()=>{const e=document.createElement('div');e.style.setProperty(p,value);check(e.style.getPropertyValue(p)===value&&CSS.supports(p,value),'valid unit syntax lost');});
 // These rows test acceptance only, not folding or native clamp layout.
 for(const value of ['clamp(none, 10px, 20px)','clamp(0px, 10px, none)','clamp(none, 10px, none)'])test(p+' unbounded clamp syntax '+value,()=>{const e=document.createElement('div');e.style.setProperty(p,value);check(e.style.getPropertyValue(p)!==''&&CSS.supports(p,value),'valid unbounded clamp rejected');});
}
for(const [mode,physical,logical] of [['horizontal-tb','min-width','min-inline-size'],['horizontal-tb','min-height','min-block-size'],['vertical-rl','min-height','min-inline-size'],['vertical-rl','min-width','min-block-size']])for(const reverse of [false,true])test('setter order '+mode+' '+physical+' '+reverse,()=>{const e=document.createElement('div');e.style.writingMode=mode;const a=reverse?logical:physical,b=reverse?physical:logical;e.style.setProperty(a,'17px');e.style.setProperty(b,'23px');e.style.setProperty(a,'29px');document.body.appendChild(e);try{check(getComputedStyle(e).getPropertyValue(physical)==='29px','later setter did not win mapping group');}finally{e.remove();}});
const result=passed===total?'PASS':'FAIL';console.log('RESULTS css-min-size-tokens:'+result+' '+JSON.stringify({passed,total}));document.documentElement.setAttribute('data-css-min-size-tokens',result);
})();</script>
