<!doctype html><meta name="viewport" content="width=device-width"><title>Page zoom root scroll</title>
<style>
body{margin:0}#fixed{position:fixed;left:20px;top:20px;width:140px;height:50px;background:#2578c9;color:white;border:0}
#absolute{position:absolute;left:200px;top:20px;width:140px;height:50px;background:#7a4}
#extent{height:2000px}#actions{position:fixed;bottom:10px;left:20px;z-index:10}#actions button{width:100px;height:40px}
iframe{position:absolute;left:360px;top:20px;width:160px;height:80px;border:0}
</style>
<button id="fixed">Fixed target</button><div id="absolute">Moving target</div><div id="extent">Root extent</div>
<iframe src="root-scroll-frame.html"></iframe>
<div id="actions"><button id="top">Top</button><button id="bottom">Bottom</button><button id="chain">Chain</button></div>
<script>
function emit(prefix,row){console.log(prefix+' '+JSON.stringify(row));if(location.protocol==='http:')fetch('/report',{method:'POST',body:JSON.stringify({fixture:'root-scroll',prefix,...row})}).catch(()=>{})}
function report(kind,e){const f=document.getElementById('fixed'),r=f.getBoundingClientRect();emit('ROOT_SCROLL',{kind,time:performance.now(),scrollY,top:r.top,left:r.left,position:getComputedStyle(f).position,x:e&&e.clientX,y:e&&e.clientY,target:e&&e.target===document?'document':e&&e.target.id,trusted:e&&e.isTrusted,bubbles:e&&e.bubbles});}
addEventListener('scroll',e=>report('window-scroll',e));
document.addEventListener('scroll',e=>report('document-scroll',e));
document.getElementById('fixed').onclick=e=>report('fixed-click',e);
document.addEventListener('click',e=>report('any-click',e));
addEventListener('message',e=>{if(e.data&&e.data.frameScroll)emit('FRAME_SCROLL',{...e.data,parentScrollY:scrollY})});
document.getElementById('top').onclick=()=>{scrollTo(0,-100);report('api-top')};
document.getElementById('bottom').onclick=()=>{scrollTo(0,1000000);report('api-bottom')};
let chained=false;
document.getElementById('chain').onclick=()=>{chained=true;scrollTo(0,120);report('api-chain')};
document.addEventListener('scroll',()=>{if(chained&&scrollY===120){chained=false;scrollTo(0,240)}});
report('load');
</script>
