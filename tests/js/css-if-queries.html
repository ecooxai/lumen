 const make=css=>{const p=document.createElement('div'),t=document.createElement('div');p.style.cssText='position:absolute;left:40px;top:30px;width:240px;height:100px';t.style.cssText='display:block;height:10px;margin:0;padding:0;border:0;background:green;'+css;p.appendChild(t);document.body.appendChild(p);owned.push(p);return {p,t};};

35,"expected":55},{"name":"not unknown stays unknown inside media","query":"media(not (not-a-media-feature))","yes":56,"no":36,"expected":36},{"name":"a true media operand decides or unknown","query":"media((min-color:1) or (not-a-media-feature))","yes":57,"no":37,"expected":57},{"name":"style and media and supports share the selected condition","query":"style(--ok:yes) and media(min-color:1) and supports(display:contents)","yes":58,"no":38,"expected":58},{"name":"the visited query condition substitutes its variable","query":"var(--condition)","yes":59,"no":39,"expected":59},{"name":"standards mode does not add a width unit","query":"supports(width:30)","yes":60,"no":40,"expected":40},{"name":"typed preferred width syntax uses its native validator","query":"supports(width:calc(2px + 3px))","yes":61,"no":41,"expected":61}];
 for(const c of cases)await check(c.name,()=>{const {t}=make('--ok:yes;--condition:supports(display:flex);--chosen:if('+c.query+':'+c.yes+'px;else:'+c.no+'px);width:var(--chosen)'),before=t.getAttribute('style');width(t,c.expected);const r=t.getBoundingClientRect();eq(document.elementFromPoint(r.x+3,r.y+3),t,'hit testing uses selected width');eq(t.getAttribute('style'),before,'computed reads preserve declaration');});
 for(const mode of ['inline','rule'])await check(mode+' custom condition mutation recomputes the selected query',async()=>{
  const {t}=make('--condition:media(min-color:1);width:if(var(--condition):70px;else:30px)');let style=t.style;
  if(mode==='rule'){t.id='if-query-rule-target';const s=document.createElement('style');s.textContent='#if-query-rule-target{--condition:media(min-color:1)}';document.head.appendChild(s);owned.push(s);t.style.removeProperty('--condition');style=s.sheet.cssRules[0].style;}
  width(t,70);style.setProperty('--condition','supports(display:invalid)');await frame();width(t,30);style.setProperty('--condition','supports(display:flex)');await frame();width(t,70);
 });

  for(const [h,w]of [[50,71],[100,31],[200,71],[300,31]]){f.style.height=h+'px';await frame();await frame();eq(f.contentWindow.innerHeight,h,'actual child viewport height');width(f.contentDocument.getElementById('direct'),w,f.contentWindow);width(f.contentDocument.getElementById('child'),w+1,f.contentWindow);}
 });
 await check('supports declaration observes the actual quirks document mode',async()=>{const f=document.createElement('iframe');f.style.cssText='position:absolute;left:0;top:0;width:240px;height:100px;border:0';document.body.appendChild(f);owned.push(f);f.contentDocument.open();f.contentDocument.write('<html><body style="margin:0"><div id="target" style="height:10px;width:if(supports(width:30):73px;else:33px)"></div></body></html>');f.contentDocument.close();await frame();eq(f.contentDocument.compatMode,'BackCompat','real quirks document');width(f.contentDocument.getElementById('target'),73,f.contentWindow);});

})().catch(error=>{document.documentElement.setAttribute('data-css-if-queries','FAIL');console.log('RESULTS css-if-queries:FAIL '+JSON.stringify({error:String(error)}));});
</script>
