<!doctype html><meta charset="utf-8"><title>CSS page selector grammar and mutation</title><body><script>
(()=>{'use strict';let total=0,passed=0;
function check(ok,message){if(!ok)throw Error(message);}
function test(name,fn){total++;try{fn();passed++;console.log('PAGE_SELECTOR_ROW '+JSON.stringify({name,pass:true}));}catch(e){console.log('PAGE_SELECTOR_ROW '+JSON.stringify({name,pass:false,error:String(e)}));}}
function rule(){const s=new CSSStyleSheet();s.insertRule('@page Keep:left { margin: 1px; }');return {s,r:s.cssRules[0]};}
const valid=[['',''],['  Name:First  ','Name:first'],[':LEFT',':left'],[':Blank',':blank'],['Name:first:first','Name:first:first'],['Name:first:left:right:first','Name:first:left:right:first'],['First,Second:RIGHT','First, Second:right'],[' :left , :right ',':left, :right'],['auto','auto'],['initial','initial'],['--chapter','--chapter'],['-chapter','-chapter'],['Étage:first','Étage:first'],['\\31 chapter:FiRsT','\\31 chapter:first'],['na\\6de:first','na۞:first'],['na\\6d e:first','name:first'],['Name:\\66 irst','Name:first'],['na\\,me:left','na\\,me:left'],['name\\{\\}two','name\\{\\}two'],['na\\ me','na\\ me'],['\\-','\\-'],['\\0 x','�x'],['Name/**/:first','Name:first'],['Name:/**/FIRST','Name:first'],['/**/Name:first/**/','Name:first'],['Name:first/**/:left','Name:first:left'],['Name/* unterminated','Name']];
const invalid=['Name :first',':first :left',': first',':notapagepseudo',':nth(2)',':first()',':LEFTx','Name Other','na/**/me',':fi/**/rst',',',',Name','Name,','Name,,Other','Name, :bogus','1name','-1name','-','*','#name','Name > Other','[name]','Name;','Name {}','"Name"','Name\\\n:first','Name\\31  :first'];
for(const [input,expected] of valid)test('setter valid '+JSON.stringify(input),()=>{const {r}=rule(),style=r.style;r.selectorText=input;check(r.selectorText===expected,JSON.stringify(r.selectorText)+' != '+JSON.stringify(expected));check(r.style===style,'style identity changed');check(r.style.margin==='1px','declaration lost');});
for(const input of invalid)test('setter invalid '+JSON.stringify(input),()=>{const {r}=rule(),before=r.cssText,style=r.style;r.selectorText=input;check(r.selectorText==='Keep:left','invalid value replaced selector: '+r.selectorText);check(r.cssText===before,'invalid value changed cssText');check(r.style===style,'style identity changed');});
for(const [input,expected] of valid.filter(x=>!x[0].includes('unterminated')))test('insert valid '+JSON.stringify(input),()=>{const s=new CSSStyleSheet();s.insertRule('@page '+input+' { margin: 1px; }');check(s.cssRules.length===1,'rule missing');check(s.cssRules[0].selectorText===expected,JSON.stringify(s.cssRules[0].selectorText)+' != '+JSON.stringify(expected));});
for(const input of invalid.filter(x=>!x.includes('{}')))test('insert invalid '+JSON.stringify(input),()=>{const s=new CSSStyleSheet();let caught=false;try{s.insertRule('@page '+input+' { }');}catch(e){caught=e.name==='SyntaxError';}check(caught,'invalid rule accepted');check(s.cssRules.length===0,'failed insert changed list');});
test('invalid selector preserves detached rule ownership',()=>{const {s,r}=rule();s.deleteRule(0);r.selectorText='Bad :first';check(r.selectorText==='Keep:left','invalid detached mutation');check(r.parentStyleSheet===null,'detached ownership changed');r.selectorText='After:Right';check(r.selectorText==='After:right','valid detached mutation failed');});
test('throwing string conversion preserves rule',()=>{const {r}=rule();const before=r.cssText,sentinel={};let caught=false;try{r.selectorText={toString(){throw sentinel;}};}catch(e){caught=e===sentinel;}check(caught&&r.cssText===before,'conversion failure mutated rule');});
test('symbol conversion throws and preserves rule',()=>{const {r}=rule();let caught=false;try{r.selectorText=Symbol('page');}catch(e){caught=e instanceof TypeError;}check(caught&&r.selectorText==='Keep:left','symbol conversion accepted');});
test('private escaping does not call public CSS.escape',()=>{const {r}=rule(),old=CSS.escape;try{CSS.escape=()=>{throw Error('public escape called');};r.selectorText='\\31 name:LEFT';check(r.selectorText==='\\31 name:left','incorrect private serialization');}finally{CSS.escape=old;}});
test('style text drops invalid rules and normalizes valid ones',()=>{const e=document.createElement('style');e.textContent='@page Bad :first {} @page Good:LEFT { margin: 1px; } @page , {}';document.head.appendChild(e);check(e.sheet.cssRules.length===1,'invalid rules retained');check(e.sheet.cssRules[0].selectorText==='Good:left','valid rule not canonical');e.remove();});
test('replaceSync preserves comments without merging identifiers',()=>{const s=new CSSStyleSheet();s.replaceSync('@page Name/**/:FIRST {} @page na/**/me {}');check(s.cssRules.length===1&&s.cssRules[0].selectorText==='Name:first','comments changed token boundaries');});
const result=passed===total?'PASS':'FAIL';console.log('RESULTS css-page-selectors:'+result+' '+JSON.stringify({passed,total}));document.documentElement.setAttribute('data-css-page-selectors',result);
})();</script>
