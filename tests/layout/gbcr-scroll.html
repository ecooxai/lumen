<!doctype html><!-- needs layout: LUMEN_CONSOLE=1 ./build/lumen file://$PWD/tests/layout/gbcr-scroll.html (build/jsrun has no layout) -->
<style>body{margin:0}#s{position:relative;height:100px;overflow:auto}#s div{height:50px}#t{transform:translate(30px,40px);width:10px;height:10px}#f{position:fixed;top:5px;left:5px}#r{display:flex;flex-direction:column-reverse;height:100px;overflow:auto}#r div{height:50px;flex:none}</style>
<div id=s><div></div><div></div><div id=c></div><div></div><div></div></div>
<div id=t></div><div id=f>f</div>
<div id=r><div id=r0></div><div></div><div></div><div></div></div>
<script>
setTimeout(()=>{
 const $=id=>document.getElementById(id), s=$('s');
 s.scrollTop=60;
 const c=$('c').getBoundingClientRect(), t=$('t').getBoundingClientRect(), r0=$('r0').getBoundingClientRect(), rr=$('r').getBoundingClientRect();
 console.log('RESULTS gbcr-scroll scrolled:'+(c.top===40?'PASS':'FAIL:'+c.top)+' offsetTop:'+($('c').offsetTop===100?'PASS':'FAIL:'+$('c').offsetTop)
  +' translate:'+(t.left===30&&t.top===140?'PASS':'FAIL:'+t.left+','+t.top)+' fixedParent:'+($('f').offsetParent===null?'PASS':'FAIL')
  +' reverse:'+(r0.top===rr.top+50?'PASS':'FAIL:'+r0.top+' vs '+rr.top));
},300);
</script>
