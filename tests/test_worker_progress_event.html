<!doctype html><meta charset="utf-8"><title>Worker ProgressEvent conversion</title>
<script>
const workerSource = `
const rows = [];
function check(name, condition) { rows.push({name, passed: !!condition}); }
for (const [name, value, expected] of [
    ['negative zero', -0, 0], ['negative modulus', -(2 ** 64), 0],
    ['negative double modulus', -(2 ** 65), 0], ['NaN', NaN, 0],
    ['infinity', Infinity, 0], ['positive fraction', 1.75, 1],
    ['above modulus', 2 ** 64 + 4096, 4096],
]) {
    const event = new ProgressEvent('progress', {loaded: value, total: value});
    check(name + ' loaded', Object.is(event.loaded, expected));
    check(name + ' total', Object.is(event.total, expected));
}
for (const value of [1n, Symbol('value')]) {
    let thrown = false;
    try { new ProgressEvent('progress', {loaded: value}); }
    catch (error) { thrown = error instanceof TypeError; }
    check(typeof value + ' rejects', thrown);
}
postMessage(rows);
`;
const url = URL.createObjectURL(new Blob([workerSource], {type: 'application/javascript'}));
const worker = new Worker(url);
worker.onmessage = event => {
    worker.terminate(); URL.revokeObjectURL(url);
    console.log('WORKER_PROGRESS_EVENT_RESULTS ' + JSON.stringify({rows: event.data}));
};
worker.onerror = event => {
    worker.terminate(); URL.revokeObjectURL(url);
    console.log('WORKER_PROGRESS_EVENT_RESULTS ' + JSON.stringify({error: event.message}));
};
</script>
