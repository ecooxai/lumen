<!doctype html>
<body style="margin:0">
<div style="width:600px">
<div id="pl" style="line-height:0;position:relative;width:400px;height:40px;margin:0 auto">
<iframe id="f" style="width:100%" frameborder="0" srcdoc="<p style='margin:0'>ad</p>"></iframe></div>
<p id="t" style="margin:0;font:20px sans-serif">TEXT UNDER THE FRAME</p>
<iframe id="g"></iframe>
</div>
<script>
const r = id => { const q = document.getElementById(id).getBoundingClientRect(); return [q.width, q.height].map(Math.round); };
setTimeout(() => console.log('IFRT ' + JSON.stringify([
    r('f')[0] == 400, r('f')[1] == 150,   /* no intrinsic ratio: 100% wide keeps the 150px default height */
    r('g')[0] == 304, r('g')[1] == 154    /* default border without frameborder=0 */
])), 300);
</script>
