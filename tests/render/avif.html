<!doctype html>
<body style="margin:0">
<img id=i src="avif-96x64.avif">
<script>
const done = () => { const c = document.createElement('canvas'); c.width = 96; c.height = 64; const g = c.getContext('2d'); g.drawImage(i, 0, 0); const p = g.getImageData(48, 32, 1, 1).data;
  console.log('AVIF ' + JSON.stringify([i.naturalWidth, i.naturalHeight, p[0] > 200 && p[1] < 60 && p[2] < 60])); };
if (i.complete) requestAnimationFrame(done); else { i.onload = done; i.onerror = () => console.log('AVIF error'); }
</script>
