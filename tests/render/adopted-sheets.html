<!doctype html>
<body style="margin:0">
<div id=light class="hidden">light .hidden must stay visible</div>
<div id=dk class="dk">doc-adopted</div>
<div id=host></div>
<script>
const sr = host.attachShadow({mode: 'open'});
sr.innerHTML = '<div id=a class=hidden>A</div><div id=b class=x>B</div>';
const s1 = new CSSStyleSheet(); s1.replaceSync('.hidden{display:none} .x{height:40px}');
sr.adoptedStyleSheets = [s1];
const s2 = new CSSStyleSheet(); s2.replaceSync('.dk{height:50px}');
document.adoptedStyleSheets.push(s2);
requestAnimationFrame(() => requestAnimationFrame(() => {
  const h = e => Math.round(e.getBoundingClientRect().height);
  const r1 = [h(light) > 0, h(sr.getElementById('a')) === 0, h(sr.getElementById('b')) === 40, h(dk) === 50];
  s1.replaceSync('.x{height:20px}');
  requestAnimationFrame(() => { const r2 = h(sr.getElementById('b')) === 20 && h(sr.getElementById('a')) > 0;
    sr.adoptedStyleSheets = []; requestAnimationFrame(() => { const r3 = h(sr.getElementById('b')) < 40;
      console.log('ADOPT ' + JSON.stringify([...r1, r2, r3, document.styleSheets.length === 0, document.adoptedStyleSheets.length === 1]) ); }); });
}));
</script>
