<!doctype html>
<body style="margin:0;font:16px sans-serif">
<div style="position:relative"><div id="pop" style="position:absolute;top:30px;left:0;width:300px;height:60px;z-index:3;background:#fff">popup</div></div>
<div style="position:relative;height:120px"><a id="under" href="#" style="display:block;height:120px">under link</a></div>
<div style="position:relative;z-index:0"><div id="pop2" style="position:absolute;top:30px;left:0;width:300px;height:60px;z-index:3;background:#fff">contained</div></div>
<div style="position:relative;height:120px"><a id="under2" href="#" style="display:block;height:120px">later wins</a></div>
<script>
setTimeout(() => {
  const at = (el, dy) => { const r = el.getBoundingClientRect(); return document.elementFromPoint(r.left + 10, r.top + dy); };
  const a = at(document.getElementById('pop'), 10), b = at(document.getElementById('pop2'), 10);
  console.log('HITZ ' + JSON.stringify([a && a.id == 'pop', b && b.id == 'under2']));
}, 300);
</script>
