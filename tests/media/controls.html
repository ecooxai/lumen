<!doctype html><title>video controls</title>
<body style="font:14px sans-serif;margin:20px">
<p>With controls attribute:</p>
<video id=a src="test.mp4" controls width=480 loop></video>
<p>Without controls (bar only when "always show video controls" is on):</p>
<video id=b src="test.mp4" width=480 muted loop autoplay></video>
</body>
