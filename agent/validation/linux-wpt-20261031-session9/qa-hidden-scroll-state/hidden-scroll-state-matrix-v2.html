<!doctype html><meta charset="utf-8">
<title>Authored hidden scroll state reference matrix</title>
<style>html,body{margin:0;padding:0}body{min-height:800px}</style>
<script>
(async () => {
    const records = [], completed = [];
    const twoFrames = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const setXY = (element, x, y) => { element.scrollLeft = x; element.scrollTop = y; };
    const rect = element => { const r = element.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; };
    const offsets = element => ({x:element.scrollLeft,y:element.scrollTop});
    const read = element => {
        const before = offsets(element);
        const client = {width:element.clientWidth,height:element.clientHeight};
        const scroll = {width:element.scrollWidth,height:element.scrollHeight};
        const bounds = rect(element), after = offsets(element), style = getComputedStyle(element);
        return {before,after,client,scroll,max:{x:Math.max(0,scroll.width-client.width),y:Math.max(0,scroll.height-client.height)},
            bounds,contentVisibility:style.contentVisibility,overflowX:style.overflowX,overflowY:style.overflowY};
    };
    const sample = async (id, phase, owner, inner, leaf) => {
        await twoFrames();
        const record = {id,phase,time:performance.now(),owner:read(owner)};
        if (inner) record.inner = read(inner);
        if (leaf) record.leafBounds = rect(leaf);
        // Expose any offset changes caused by descendant geometry reads.
        record.ownerAfterDescendantReads = offsets(owner);
        if (inner) record.innerAfterDescendantReads = offsets(inner);
        records.push(record);
        console.log('DIAGNOSTIC hidden-scroll-state ' + JSON.stringify(record));
    };
    const basic = () => {
        const owner = document.createElement('div'), leaf = document.createElement('div');
        owner.style.cssText = 'width:120px;height:100px;overflow:hidden;content-visibility:visible';
        leaf.style.cssText = 'width:400px;height:400px';
        owner.appendChild(leaf);document.body.appendChild(owner);setXY(owner,80,90);
        return {owner,leaf};
    };
    const nested = () => {
        const owner = document.createElement('div'), inner = document.createElement('div');
        const leaf = document.createElement('div'), tail = document.createElement('div');
        owner.style.cssText = 'width:160px;height:140px;overflow:hidden;content-visibility:visible';
        inner.style.cssText = 'width:120px;height:100px;margin-left:40px;margin-top:70px;overflow:hidden;content-visibility:visible';
        leaf.style.cssText = 'width:400px;height:400px';tail.style.cssText = 'width:450px;height:450px';
        inner.appendChild(leaf);owner.appendChild(inner);owner.appendChild(tail);document.body.appendChild(owner);
        setXY(owner,40,50);setXY(inner,60,70);return {owner,inner,leaf};
    };
    try {
        {
            const id='retain-both-axes', {owner,leaf}=basic();
            await sample(id,'visible',owner,null,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'hidden',owner,null,leaf);
            owner.style.contentVisibility='visible';await sample(id,'revealed',owner,null,leaf);
            owner.remove();completed.push(id);
        }
        for (const [id,x,y] of [['hidden-set-zero',0,0],['hidden-set-positive',31,47]]) {
            const {owner,leaf}=basic();await sample(id,'visible',owner,null,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'hidden-before-set',owner,null,leaf);
            setXY(owner,x,y);await sample(id,'hidden-after-set',owner,null,leaf);
            owner.style.contentVisibility='visible';await sample(id,'revealed',owner,null,leaf);
            owner.remove();completed.push(id);
        }
        {
            const id='range-shrink-and-regrow', {owner,leaf}=basic();
            await sample(id,'visible',owner,null,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'hidden',owner,null,leaf);
            leaf.style.width='150px';leaf.style.height='130px';await sample(id,'hidden-shrunk',owner,null,leaf);
            owner.style.contentVisibility='visible';await sample(id,'revealed-shrunk',owner,null,leaf);
            leaf.style.width='400px';leaf.style.height='400px';await sample(id,'visible-regrown',owner,null,leaf);
            owner.remove();completed.push(id);
        }
        {
            const id='overflow-mode-change', {owner,leaf}=basic();
            await sample(id,'visible-scroll-container',owner,null,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'hidden',owner,null,leaf);
            owner.style.overflow='visible';await sample(id,'hidden-overflow-visible',owner,null,leaf);
            owner.style.contentVisibility='visible';await sample(id,'revealed-overflow-visible',owner,null,leaf);
            owner.style.overflow='hidden';await sample(id,'scroll-container-restored',owner,null,leaf);
            owner.remove();completed.push(id);
        }
        {
            const id='nested-outer-hidden-inner-setter', {owner,inner,leaf}=nested();
            await sample(id,'visible',owner,inner,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'outer-hidden',owner,inner,leaf);
            setXY(inner,31,47);await sample(id,'inner-set-under-hidden-outer',owner,inner,leaf);
            owner.style.contentVisibility='visible';await sample(id,'outer-revealed',owner,inner,leaf);
            owner.remove();completed.push(id);
        }
        {
            const id='nested-independently-hidden', {owner,inner,leaf}=nested();
            await sample(id,'visible',owner,inner,leaf);
            inner.style.contentVisibility='hidden';await sample(id,'inner-hidden',owner,inner,leaf);
            owner.style.contentVisibility='hidden';await sample(id,'both-hidden',owner,inner,leaf);
            owner.style.contentVisibility='visible';await sample(id,'outer-revealed-inner-hidden',owner,inner,leaf);
            inner.style.contentVisibility='visible';await sample(id,'both-revealed',owner,inner,leaf);
            owner.remove();completed.push(id);
        }
        if (completed.length !== 7 || records.length !== 30) throw new Error('incomplete reference matrix');
        console.log('MEASUREMENTS hidden-scroll-state:COMPLETE ' + JSON.stringify({completed,records:records.length}));
        // Adapter transport completion only: numeric observations are not graded.
        console.log('RESULTS hidden-scroll-state:PASS');
    } catch (error) {
        console.log('MEASUREMENTS hidden-scroll-state:ERROR ' + String(error));
        console.log('RESULTS hidden-scroll-state:FAIL ' + String(error));
    }
    document.documentElement.setAttribute('data-hidden-scroll-state-complete','1');
})();
</script>
