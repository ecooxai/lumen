[package]
name = "lumen-webtransport-native-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wtransport = { version = "=0.7.2", features = ["quinn"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
serde_json = "1"

[profile.release]
codegen-units = 2
lto = "thin"
