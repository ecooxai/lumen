<!doctype html><meta charset="utf-8"><title>Background position type controls</title><body><script>
(async()=>{'use strict';const marker='background-position-types40-v1',prefix='BACKGROUND_POSITION_TYPE_ROW ',rows=[];let serial=0;
function check(name,fn){let row;try{const result=fn();row={name,pass:result.pass,observations:result.observations};}catch(error){row={name,pass:false,error:String(error)};}rows.push(row);console.log(prefix+JSON.stringify(row));}
function measure(text,sheet=false){const el=document.createElement('div');el.id='bgtype'+(++serial);document.body.append(el);let style=null;if(sheet){style=document.createElement('style');style.textContent='#'+el.id+'{'+text+'}';document.head.append(style);}else el.setAttribute('style',text);const c=getComputedStyle(el),o={position:c.backgroundPosition,x:c.backgroundPositionX,y:c.backgroundPositionY,size:c.backgroundSize,repeat:c.backgroundRepeat};el.remove();if(style)style.remove();return o;}
const invalid=["calc(2)", "calc(0)", "min(1, 2)", "max(0, 0)", "clamp(0, 1, 2)", "calc(2px / 1px)"];
for(const value of invalid){for(const ingress of ['attribute','stylesheet'])check(ingress+' rejects number math '+value,()=>{const o=measure('background-position:13px 17px;background-position:'+value+' 4px',ingress==='stylesheet');return{pass:o.position==='13px 17px',observations:o};});
check('var substitution rejects number math '+value,()=>{const o=measure('background-position:13px 17px;--typed:'+value+';background-position:var(--typed) 4px');return{pass:o.position==='0% 0%',observations:o};});
check('CSSOM rejects number math '+value,()=>{const el=document.createElement('div');document.body.append(el);el.style.backgroundPosition='13px 17px';el.style.setProperty('background-position',value+' 4px');const supports=CSS.supports('background-position',value+' 4px'),specified=el.style.backgroundPosition,computed=getComputedStyle(el).backgroundPosition;el.remove();return{pass:!supports&&specified==='13px 17px'&&computed==='13px 17px',observations:{supports,specified,computed}};});}
for(const[label,value,expected]of [["bare zero", "0 0", "0px 0px"], ["signed zero", "-0 +0", "0px 0px"], ["pixel lengths", "2px 4px", "2px 4px"], ["percentages", "10% 20%", "10% 20%"], ["length functions", "calc(2px) calc(4px)", "2px 4px"], ["mixed length percentage", "calc(10% + 2px) calc(20% - 3px)", "calc(10% + 2px) calc(20% - 3px)"], ["four component edges", "right 2px bottom 4px", "calc(100% - 2px) calc(100% - 4px)"], ["three component end", "right 2px bottom", "calc(100% - 2px) 100%"], ["three component start", "left 2px top", "2px 0%"], ["two layers", "left top, right bottom", "0% 0%, 100% 100%"]])check('native valid '+label,()=>{const o=measure((label==='two layers'?'background-image:none,none;':'')+'background-position:'+value);return{pass:o.position===expected&&CSS.supports('background-position',value),observations:{...o,expected}};});
check('native x offset rejects number math',()=>{const o=measure('background-position:13px 17px;background-position-x:right calc(2)');return{pass:o.position==='13px 17px',observations:o};});
check('native y offset rejects number math',()=>{const o=measure('background-position:13px 17px;background-position-y:bottom calc(0)');return{pass:o.position==='13px 17px',observations:o};});
check('native axis length functions remain valid',()=>{const o=measure('background-position-x:right calc(2px);background-position-y:bottom calc(4px)');return{pass:o.position==='calc(100% - 2px) calc(100% - 4px)',observations:o};});
for(const[label,value,expected,size]of [["three component size", "none right 2px bottom / 10px 20px no-repeat", "calc(100% - 2px) 100%", "10px 20px"], ["four component gradient", "linear-gradient(red, red) left 2px top 4px / 8px 9px no-repeat", "2px 4px", "8px 9px"], ["two layers", "none 0 0, none right bottom", "0px 0px, 100% 100%", "auto, auto"]])check('valid background shorthand '+label,()=>{const o=measure('background:'+value);return{pass:o.position===expected&&o.size===size,observations:{...o,expected,sizeExpected:size}};});
const passed=rows.filter(r=>r.pass).length,status=passed===rows.length?'PASS':'FAIL';console.log('RESULTS '+marker+':'+status+' '+JSON.stringify({passed,total:rows.length}));document.documentElement.setAttribute('data-'+marker,status);
})();
</script></body>
