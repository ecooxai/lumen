plugins {
    id 'com.android.application'
}

def sdlDirectory = providers.gradleProperty('lumenSdlDir').orElse(providers.environmentVariable('LUMEN_SDL_DIR'))
def dependenciesDirectory = providers.gradleProperty('lumenDepsDir').orElse(providers.environmentVariable('LUMEN_DEPS_DIR'))
def v8Directory = providers.gradleProperty('lumenV8Dir').orElse(providers.environmentVariable('LUMEN_V8_DIR'))
def wgpuDirectory = providers.gradleProperty('lumenWgpuDir').orElse(providers.environmentVariable('LUMEN_WGPU_DIR'))
def requestedAbis = providers.gradleProperty('lumenAbis').orElse('arm64-v8a').get().split(',', -1).collect { it.trim() } as Set
if (requestedAbis.isEmpty() || !(['arm64-v8a', 'x86_64'] as Set).containsAll(requestedAbis)) {
    throw new GradleException('lumenAbis must contain arm64-v8a and/or x86_64, separated by commas.')
}
if (!sdlDirectory.isPresent() || !dependenciesDirectory.isPresent() || !v8Directory.isPresent()) {
    throw new GradleException('Set lumenSdlDir, lumenDepsDir and lumenV8Dir to SDL3 sources, ABI-specific native dependencies and the pinned V8 source checkout. This adapter does not use Android WebView.')
}
def sdlRoot = file(sdlDirectory.get())
def depsRoot = file(dependenciesDirectory.get())
def v8Root = file(v8Directory.get())
def v8Toolchain = new File(rootProject.projectDir.parentFile, 'cmake/android-v8.toolchain.cmake')
if (!new File(sdlRoot, 'android-project/app/src/main/java/org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException('lumenSdlDir must contain the SDL3 Android Java sources matching the native SDL build.')
}
if (!new File(v8Root, 'include/v8.h').isFile() ||
        !new File(v8Root, 'third_party/llvm-build/Release+Asserts/bin/clang++').isFile()) {
    throw new GradleException('lumenV8Dir must contain the pinned V8 headers and its matching Clang compiler.')
}

android {
    namespace 'org.lumen.browser'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.lumen.browser'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0-adapter'
        ndk {
            abiFilters.addAll(requestedAbis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DLUMEN_SDL_DIR=${sdlRoot.absolutePath}",
                    "-DLUMEN_DEPS_DIR=${depsRoot.absolutePath}",
                    "-DLUMEN_V8_DIR=${v8Root.absolutePath}",
                    "-DCMAKE_TOOLCHAIN_FILE=${v8Toolchain.absolutePath}",
                    '-DLUMEN_BUILD_TESTS=OFF', '-DANDROID_STL=c++_shared'
                if (wgpuDirectory.isPresent()) {
                    arguments "-DLUMEN_WGPU_DIR=${file(wgpuDirectory.get()).absolutePath}"
                }
                targets 'main'
            }
        }
    }
    sourceSets {
        main.java.srcDir new File(sdlRoot, 'android-project/app/src/main/java')
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
