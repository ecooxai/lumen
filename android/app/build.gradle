plugins {
    id 'com.android.application'
}

def sdlDirectory = providers.gradleProperty('lumenSdlDir').orElse(providers.environmentVariable('LUMEN_SDL_DIR'))
def dependenciesDirectory = providers.gradleProperty('lumenDepsDir').orElse(providers.environmentVariable('LUMEN_DEPS_DIR'))
def v8Directory = providers.gradleProperty('lumenV8Dir').orElse(providers.environmentVariable('LUMEN_V8_DIR'))
def v8PrebuiltDirectory = providers.gradleProperty('lumenV8PrebuiltDir').orElse(providers.environmentVariable('LUMEN_V8_PREBUILT_DIR'))
def v8CompilerDirectory = providers.gradleProperty('lumenV8CompilerDir').orElse(providers.environmentVariable('LUMEN_V8_COMPILER_DIR'))
def wgpuDirectory = providers.gradleProperty('lumenWgpuDir').orElse(providers.environmentVariable('LUMEN_WGPU_DIR'))
def requestedAbis = providers.gradleProperty('lumenAbis').orElse('arm64-v8a').get().split(',', -1).collect { it.trim() } as Set
if (requestedAbis.isEmpty() || !(['arm64-v8a', 'x86_64'] as Set).containsAll(requestedAbis)) {
    throw new GradleException('lumenAbis must contain arm64-v8a and/or x86_64, separated by commas.')
}
if (!sdlDirectory.isPresent() || !dependenciesDirectory.isPresent() ||
        (!v8PrebuiltDirectory.isPresent() && !v8Directory.isPresent())) {
    throw new GradleException('Set lumenSdlDir, lumenDepsDir and either lumenV8Dir or lumenV8PrebuiltDir. This adapter uses the Lumen engine, not Android WebView.')
}
def sdlRoot = file(sdlDirectory.get())
def depsRoot = file(dependenciesDirectory.get())
def v8Root = v8Directory.isPresent() ? file(v8Directory.get()) : null
def v8PrebuiltRoot = v8PrebuiltDirectory.isPresent() ? file(v8PrebuiltDirectory.get()) : null
def v8CompilerRoot = v8CompilerDirectory.isPresent() ? file(v8CompilerDirectory.get()) :
        (v8Root != null ? new File(v8Root, 'third_party/llvm-build/Release+Asserts/bin') : null)
def v8Toolchain = new File(rootProject.projectDir.parentFile, 'cmake/android-v8.toolchain.cmake')
if (!new File(sdlRoot, 'android-project/app/src/main/java/org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException('lumenSdlDir must contain the SDL3 Android Java sources matching the native SDL build.')
}
if (v8CompilerRoot == null || !new File(v8CompilerRoot, 'clang++').isFile()) {
    throw new GradleException('Provide lumenV8CompilerDir with the verified Clang compiler, or a matching lumenV8Dir checkout.')
}
if (v8PrebuiltRoot != null) {
    if (requestedAbis != (['arm64-v8a'] as Set)) {
        throw new GradleException('The pinned prebuilt V8 supports only arm64-v8a.')
    }
    if (!new File(v8PrebuiltRoot, 'include/v8.h').isFile() ||
            !new File(v8PrebuiltRoot, 'librusty_v8.a').isFile()) {
        throw new GradleException('lumenV8PrebuiltDir must contain the pinned Android V8 SDK; CMake verifies all checksums.')
    }
} else if (!new File(v8Root, 'include/v8.h').isFile()) {
    throw new GradleException('lumenV8Dir must contain the pinned V8 headers.')
}

android {
    namespace 'org.lumen.browser'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.lumen.browser'
        minSdk v8PrebuiltRoot != null ? 29 : 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0-adapter'
        ndk {
            abiFilters.addAll(requestedAbis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DLUMEN_SDL_DIR=${sdlRoot.absolutePath}",
                    "-DLUMEN_DEPS_DIR=${depsRoot.absolutePath}",
                    "-DCMAKE_TOOLCHAIN_FILE=${v8Toolchain.absolutePath}",
                    "-DLUMEN_V8_COMPILER_DIR=${v8CompilerRoot.absolutePath}",
                    '-DLUMEN_BUILD_TESTS=OFF',
                    '-DCMAKE_JOB_POOLS=lumen_compile=6;lumen_link=1',
                    '-DCMAKE_JOB_POOL_COMPILE=lumen_compile',
                    '-DCMAKE_JOB_POOL_LINK=lumen_link',
                    '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--threads=2',
                    "-DANDROID_STL=${v8PrebuiltRoot != null ? 'none' : 'c++_shared'}"
                if (v8PrebuiltRoot != null) {
                    arguments "-DLUMEN_V8_PREBUILT_DIR=${v8PrebuiltRoot.absolutePath}"
                }
                if (v8Root != null) {
                    arguments "-DLUMEN_V8_DIR=${v8Root.absolutePath}"
                }
                if (wgpuDirectory.isPresent()) {
                    arguments "-DLUMEN_WGPU_DIR=${file(wgpuDirectory.get()).absolutePath}"
                }
                targets 'main'
            }
        }
    }
    sourceSets {
        main.java.srcDir new File(sdlRoot, 'android-project/app/src/main/java')
        main.java.srcDir '../platform/src/main/java'
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
